name: 1746 Outubro - Teste funcional isolado
on:
  push:
    branches: [preparacao-1746-outubro-2026]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Instalar Playwright
        run: |
          npm install --no-save @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Servir branch sem publicacao
        run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/1746-http.log 2>&1 &
      - name: Testar os cinco modulos em navegador real
        run: npx playwright test --config=playwright.1746.config.cjs
      - name: Guardar relatorio e capturas
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 1746-outubro-testes-navegador
          path: |
            playwright-report/
            test-results/
          retention-days: 14
