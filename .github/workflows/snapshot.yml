name: HUB COMLURB — Snapshot AR e Engenharia/DTE (Fase 6)

# Execução semanal (segunda-feira, 08:00 horário de Brasília = 11:00 UTC)
# mais execução manual pela aba Actions (workflow_dispatch). Fontes são
# mensais; a cadência semanal serve para "validação antecipada" de
# quebras estruturais, não caracteriza monitoramento contínuo.
on:
  schedule:
    - cron: '0 11 * * 1'
  workflow_dispatch: {}

# Escopo mínimo necessário: só escrita de conteúdo (para o commit dos
# snapshots/relatórios). Nenhuma outra permissão é solicitada. O
# script (snapshot/run.js verify-paths) restringe, por conta própria,
# toda escrita a data/snapshots|reports|rejected — o token em si não
# impõe essa restrição de caminho, por isso a checagem explícita é
# obrigatória antes do commit (ver step abaixo).
permissions:
  contents: write

# Evita duas execuções concorrentes tentando escrever/commitar ao
# mesmo tempo (mesma preocupação de corrida que motivou usar um único
# job em vez de dois jobs paralelos).
concurrency:
  group: hub-comlurb-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências (determinístico — usa package-lock.json)
        run: npm ci --no-audit --no-fund

      # Protege o snapshot de rodar sobre uma biblioteca quebrada: se
      # qualquer suíte obrigatória falhar, o job para aqui, ANTES de
      # tocar em data/ — não há sentido em capturar um snapshot cuja
      # base (Adapters/Rules) está com teste reprovado.
      # hub-selftest.js (Fases 2/3) é suíte de navegador por natureza
      # (usa document.getElementById/createElement), mas roda aqui via
      # testes/executar-hub-selftest-node.js — um harness Node mínimo
      # que fornece só o DOM stub necessário, sem alterar uma linha de
      # hub-selftest.js e sem depender de Playwright/Puppeteer. Ver
      # snapshot/README.md · "Testes" para o comando local equivalente.
      - name: Executar suítes obrigatórias (hub-selftest, Fase 4, Fase 5, Fase 6)
        run: |
          echo "== hub-selftest (Fases 2/3, via harness Node) =="
          node testes/executar-hub-selftest-node.js .
          echo "== Fase 4 =="
          node testes/testar-fase4.js .
          echo "== Fase 5 =="
          node testes/testar-fase5.js .
          echo "== Fase 6 =="
          node testes/testar-fase6.js .

      # testes/testar-fase5.js (Fase 5, já aprovada, não alterada por
      # esta fase) regenera engenharia-operacional/piloto/saida-
      # canonica-exemplo.json como efeito colateral já existente de
      # rodar a suíte. Sem este passo, essa regeneração apareceria em
      # `git status` como alteração fora de data/ e o step seguinte
      # (verify-paths) bloquearia o commit por um motivo que não tem
      # nada a ver com o snapshot em si. Restaura o checkout ao estado
      # de HEAD antes de qualquer escrita do snapshot — a partir daqui,
      # qualquer alteração detectada é exclusivamente do ciclo atual.
      - name: Restaurar checkout após as suítes (efeito colateral conhecido da Fase 5)
        run: git checkout -- .

      # Único job de orquestração: AR e Engenharia/DTE são processados
      # dentro do MESMO processo Node (snapshot/run.js), de forma
      # independente entre si. Uma falha em um módulo não impede o
      # processamento nem a publicação válida do outro — isso é
      # controlado dentro do próprio script, não pelo workflow.
      # continue-on-error é necessário aqui porque o job SÓ deve
      # refletir falha depois que o commit dos resultados válidos
      # (do módulo que teve sucesso) já tiver sido feito — ver o
      # último step deste job.
      - name: Executar snapshot (AR + Engenharia/DTE)
        id: executar
        continue-on-error: true
        run: node snapshot/run.js

      - name: Publicar relatório da execução como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-snapshot-${{ github.run_id }}
          path: snapshot/_artifact/
          retention-days: 90
          if-no-files-found: warn

      # Bloqueia o commit se QUALQUER arquivo fora de
      # data/snapshots|reports|rejected tiver sido alterado — nunca
      # confia apenas no escopo do token.
      - name: Verificar restrição de caminhos alterados
        id: verificar_caminhos
        if: always()
        run: node snapshot/run.js verify-paths

      - name: Commit dos resultados válidos
        if: ${{ always() && steps.verificar_caminhos.outcome == 'success' }}
        run: |
          git config user.name "hub-comlurb-snapshot-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -n "$(git status --porcelain -- data/)" ]; then
            git add data/
            git commit -m "chore(snapshot): atualização automática Fase 6 [skip ci]"
            git push
          else
            echo "Nenhuma mudança em data/ nesta execução — commit não necessário."
          fi

      # Só agora, depois de artifact publicado, caminhos verificados e
      # commit (quando aplicável) já feito, o job pode refletir a
      # falha real de algum dos dois módulos. Isso preserva e publica
      # o resultado válido do módulo que teve sucesso, mesmo quando o
      # outro falhou.
      - name: Refletir status real da execução no job
        if: always()
        run: |
          if [ "${{ steps.verificar_caminhos.outcome }}" != "success" ]; then
            echo "Verificação de caminhos falhou — nenhum commit foi feito. Ver step 'Verificar restrição de caminhos alterados'."
            exit 1
          fi
          if [ "${{ steps.executar.outcome }}" != "success" ]; then
            echo "Pelo menos um módulo (AR ou Engenharia/DTE) falhou nesta execução. Resultados válidos do outro módulo, se houver, foram publicados normalmente. Ver artifact 'relatorio-snapshot-${{ github.run_id }}'."
            exit 1
          fi
          echo "Execução concluída sem falhas nos dois módulos."
