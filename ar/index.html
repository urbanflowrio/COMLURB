<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Indicadores AR 2026 · HUB COMLURB</title>
<link rel="stylesheet" href="../assets/css/hub-premium.css">
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script src="../assets/components/hub-core.js"></script>
<script src="../assets/components/hub-sources.js"></script>
<script src="../assets/components/hub-utils.js"></script>
<script src="../assets/components/hub-layout.js"></script>
<style>
/* ── Layout base ── */
.app{max-width:1880px;padding:18px}
.arFilters{display:flex !important;flex-wrap:wrap;align-items:flex-end;gap:10px;margin:14px 0}

/* ── Resumo executivo ── */
.execSummary{display:grid;grid-template-columns:1.15fr .85fr;gap:14px;margin-bottom:14px}
.summaryHero{background:var(--painel);border:1px solid var(--linha);border-radius:22px;overflow:hidden;min-height:260px}
.summaryHero .body{min-height:210px;display:grid;grid-template-columns:auto 1fr;align-items:center;gap:28px;padding:0 28px 20px}
.bigNumber{font-size:clamp(70px,7vw,112px);font-weight:950;letter-spacing:-.07em;line-height:.9;color:#5b9bd5;white-space:nowrap}
.heroText h2{margin:0 0 10px;font-size:clamp(24px,2vw,36px);line-height:1.08;letter-spacing:-.03em}
.heroText p{margin:0;color:#c7d8ee;line-height:1.5;max-width:760px}
.statusGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.statusMini{background:var(--painel);border:1px solid var(--linha);border-radius:18px;padding:16px;min-height:120px}
.statusMini small{display:block;font-size:10px;color:#b8d4f2;font-weight:950;letter-spacing:.14em;text-transform:uppercase;margin-bottom:8px}
.statusMini b{display:block;color:#fff;font-size:32px;line-height:1;margin-bottom:7px}
.statusMini span{display:block;color:#c7d8ee;font-size:12px;line-height:1.35}
.statusMini.ok{border-color:rgba(120,170,163,.52)}
.statusMini.att{border-color:rgba(255,160,43,.46)}
.statusMini.crit{border-color:rgba(239,106,93,.52)}
.statusMini.nd{border-color:rgba(167,139,250,.42)}
.statusMini.superado{border-color:rgba(91,155,213,.52)}

/* ── Painel de Bonificação ── */
.bonusPanel{background:var(--painel);border:1px solid rgba(91,155,213,.3);border-radius:22px;padding:20px 22px;margin-bottom:14px}
.bonusPanelHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.bonusPanelHead h2{margin:0;font-size:16px;font-weight:950;color:#fff;letter-spacing:.01em}
.bonusPanelHead .hint{color:#9fb0c7;font-size:11px}
.bonusGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.bonusCard{background:rgba(255,255,255,.04);border:1px solid var(--linha);border-radius:16px;padding:14px 16px}
.bonusCard .label{font-size:10px;font-weight:950;letter-spacing:.14em;text-transform:uppercase;color:#9fb0c7;margin-bottom:6px}
.bonusCard .valor{font-size:28px;font-weight:950;color:#fff;line-height:1;margin-bottom:6px}
.bonusCard .detalhe{font-size:11px;color:#c7d8ee;line-height:1.4}
.bonusCard.destaque{border-color:rgba(91,155,213,.5);background:rgba(91,155,213,.08)}
.bonusCard.destaque .valor{color:#5b9bd5}
.metaContagem{margin-top:14px;background:rgba(255,255,255,.03);border:1px solid var(--linha);border-radius:14px;padding:12px 16px}
.metaContagem .tituloContagem{font-size:11px;font-weight:950;letter-spacing:.12em;text-transform:uppercase;color:#9fb0c7;margin-bottom:10px}
.metaLinhas{display:grid;gap:6px}
.metaLinha{display:grid;grid-template-columns:22px 1fr auto auto;gap:10px;align-items:center;font-size:12px}
.metaLinha .cod{color:#9fb0c7;font-weight:950;font-size:10px}
.metaLinha .desc{color:#c7d8ee}
.metaLinha .status-mini{font-size:10px;font-weight:950}
.metaLinha.ok .status-mini{color:#83d99d}
.metaLinha.att .status-mini{color:#ffa02b}
.metaLinha.crit .status-mini{color:#ff7d72}
.metaLinha.nd .status-mini{color:#cdbdff}
.casadoBadge{font-size:9px;background:rgba(91,155,213,.15);border:1px solid rgba(91,155,213,.4);color:#7ec3f5;border-radius:6px;padding:2px 6px;white-space:nowrap}

.btnLimpar{background:transparent;border:1px solid rgba(255,255,255,.12);border-radius:10px;color:#7a9bbf;font-size:11px;font-weight:950;letter-spacing:.08em;padding:0 16px;height:44px;cursor:pointer;white-space:nowrap;transition:border-color .15s,color .15s;flex-shrink:0}
.btnLimpar:hover{border-color:rgba(255,255,255,.28);color:#c7d8ee}

/* ── Blocos de indicadores ── */
.arBlock{margin-top:14px}
.arBlockHead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:0 2px;margin-bottom:10px}
.arBlockTitle{margin:0;font-size:18px;font-weight:950;color:#fff;letter-spacing:.01em}
.arBlockMeta{color:#c7d8ee;font-size:12px;font-weight:800}
.indicatorList{display:grid;gap:10px}

/* ── Linha de indicador ── */
.indicatorRow{background:var(--painel);border:1px solid var(--linha);border-radius:18px;padding:15px 16px;display:grid;grid-template-columns:72px minmax(280px,1.3fr) repeat(5,minmax(110px,.55fr));gap:14px;align-items:center;min-height:96px;overflow:hidden}
.indicatorRow.ok{border-left:4px solid var(--verde)}
.indicatorRow.att{border-left:4px solid var(--amarelo)}
.indicatorRow.crit{border-left:4px solid var(--vermelho)}
.indicatorRow.nd{border-left:4px solid var(--roxo)}
.indicatorRow.superado{border-left:4px solid #5b9bd5}

/* ── Grupo casado: wrapper visual ── */
.casadoWrap{background:rgba(91,155,213,.04);border:1px solid rgba(91,155,213,.22);border-radius:20px;padding:10px;margin-bottom:10px}
.casadoLabel{display:flex;align-items:center;gap:8px;padding:0 6px 8px;font-size:11px;font-weight:950;color:#7ec3f5;letter-spacing:.1em;text-transform:uppercase}
.casadoLabel svg{opacity:.7}
.casadoBonusNote{margin-top:8px;padding:8px 12px;background:rgba(91,155,213,.08);border:1px solid rgba(91,155,213,.25);border-radius:12px;font-size:11px;color:#7ec3f5;line-height:1.4}

/* ── Badge proporcional ── */
.propBadge{font-size:9px;font-weight:950;color:#7ec3f5;background:rgba(91,155,213,.12);border:1px solid rgba(91,155,213,.3);border-radius:5px;padding:1px 5px;margin-left:3px;white-space:nowrap;vertical-align:middle;cursor:help}

/* ── Células ── */
.codeBox{font-size:12px;font-weight:950;letter-spacing:.14em;color:#b8d4f2}
.indName b{display:block;color:#fff;font-size:15px;line-height:1.25;margin-bottom:5px}
.indName span{display:block;color:#aebfd5;font-size:12px;line-height:1.35;max-width:520px}
.metricCell small{display:block;color:#9fb0c7;font-size:9px;font-weight:950;letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px}
.metricCell b{display:block;color:#fff;font-size:16px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-flex;align-items:center;justify-content:center;border:1px solid #345978;border-radius:999px;padding:6px 10px;font-weight:950;font-size:11px;line-height:1;white-space:nowrap;max-width:100%}
.tag.ok{border-color:#3f7d55;color:#83d99d}
.tag.att{border-color:#8d6a23;color:#ffa02b}
.tag.crit{border-color:#8b3f38;color:#ff7d72}
.tag.nd{border-color:#6d5ba0;color:#cdbdff}
.tag.superado{border-color:#3f7d55;color:#83d99d}

/* ── Nota de governança ── */
.govNote{margin:16px 0 0;border:1px solid rgba(167,139,250,.28);background:rgba(167,139,250,.06);border-radius:16px;padding:13px 15px;color:#cdbdff;font-size:12px;line-height:1.45}
.emptyBlock{color:#aebfd5;border:1px solid var(--linha);background:var(--painel);border-radius:16px;padding:18px;text-align:center}

/* ── Drill-down E06 · Atendimento por Subprefeitura ── */
.indicatorRow.drillable{cursor:pointer;transition:border-color .18s ease,background .18s ease}
.indicatorRow.drillable:hover{border-color:rgba(91,155,213,.5);background:rgba(91,155,213,.045)}
.drillCue{display:inline-flex;align-items:center;gap:6px;margin-top:7px;color:#7ec3f5;font-size:10px;font-weight:900;letter-spacing:.05em}
.drillCue .arr{transition:transform .18s ease}
.indicatorRow.expanded .drillCue .arr{transform:rotate(90deg)}
.e06Drill{box-sizing:border-box;width:min(960px,calc(100% - 32px));max-width:none;max-height:calc(100dvh - 32px);margin:auto;padding:0;border:1px solid var(--linha);border-radius:18px;background:#0d1e30;color:#e6f0fb;box-shadow:0 24px 80px #0008;overflow:auto;overflow-wrap:normal}
.e06Drill::backdrop{background:rgba(3,10,19,.76)}
.arHistoricoVazio{margin-top:18px}
.arHistoricoIndicadores{margin-top:22px}
.arHistoricoIndicadores h4{margin:0 0 12px;color:#e6f0fb;font-size:13px}
.e06DrillHead{position:sticky;top:0;z-index:1;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:16px 22px;background:#0d1e30;border-bottom:1px solid var(--linha)}
.e06DrillBody{padding:18px 22px 22px;container-type:inline-size}
.e06Close{flex:none;background:rgba(255,255,255,.06);color:#e6f0fb;border:1px solid var(--linha);border-radius:8px;min-width:40px;height:40px;font-size:22px;cursor:pointer}
.e06Close:hover{background:rgba(91,155,213,.2)}
.e06DrillHead h3{margin:0 0 4px;color:#fff;font-size:15px}
.e06DrillHead p{margin:0;color:#9fb0c7;font-size:11px;line-height:1.4}
.e06Summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,116px),1fr));gap:8px;margin-bottom:14px}
.e06Mini{border:1px solid var(--linha);border-radius:12px;background:rgba(255,255,255,.025);padding:10px 12px}
.e06Mini small{display:block;color:#8fa6bf;font-size:9px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;margin-bottom:5px}
.e06Mini b{font-size:20px;color:#fff;white-space:nowrap}
.subprefGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:8px}
.subprefCard{appearance:none;text-align:left;border:1px solid var(--linha);border-radius:12px;background:rgba(255,255,255,.025);padding:11px 12px;cursor:pointer;color:inherit;transition:.15s ease}
.subprefCard:hover,.subprefCard.active{border-color:rgba(91,155,213,.55);background:rgba(91,155,213,.08)}
.subprefCardTop{display:flex;align-items:baseline;flex-wrap:wrap;justify-content:space-between;gap:4px 8px}
.subprefName{word-break:normal;overflow-wrap:normal;font-size:12px;font-weight:900;color:#e6f0fb}
.subprefVal{font-size:15px;font-weight:950;color:#fff;white-space:nowrap}
.subprefMeta{margin-top:5px;font-size:10px;color:#8fa6bf}
.subprefDot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:6px;background:#ff7d72}.subprefCard.ok .subprefDot{background:#83d99d}
.e06History{display:none;margin-top:14px;border-top:1px solid rgba(41,72,102,.65);padding-top:14px}
.e06History.open{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@container (min-width:640px){.e06History.open{grid-template-columns:minmax(0,1.65fr) minmax(220px,.7fr)}}
.e06ChartWrap{height:250px;min-width:0}
.e06HistoryInfo{display:flex;flex-direction:column;justify-content:center;border:1px solid var(--linha);border-radius:12px;padding:14px;background:rgba(255,255,255,.025)}
.e06HistoryInfo small{font-size:9px;color:#8fa6bf;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
.e06HistoryInfo b{font-size:25px;color:#fff;margin:4px 0 8px}
.e06HistoryInfo span{font-size:11px;color:#aebfd5;line-height:1.45}
@media(max-width:620px){.e06DrillHead,.e06DrillBody{padding:12px}.e06ChartWrap{height:220px}}

/* ── Responsivo ── */
@media(max-width:1380px){
  .indicatorRow{grid-template-columns:70px minmax(250px,1.4fr) repeat(3,minmax(110px,.6fr))}
  .indicatorRow .metricCell:nth-child(6),.indicatorRow .metricCell:nth-child(7){grid-column:auto}
  .bonusGrid{grid-template-columns:1fr 1fr}
}
@media(max-width:1180px){
  .execSummary{grid-template-columns:1fr}
  .indicatorRow{grid-template-columns:70px 1fr 1fr 1fr}
  .indName{grid-column:2/5}
  .bonusGrid{grid-template-columns:1fr 1fr}
}
@media(max-width:760px){
  .arFilters,.statusGrid,.summaryHero .body{grid-template-columns:1fr !important}
  .indicatorRow{grid-template-columns:1fr}
  .indName{grid-column:auto}
  .arBlockHead{flex-direction:column;align-items:flex-start}
  .bonusGrid{grid-template-columns:1fr}
}

/* ── Situação das metas ── */
.situacaoHead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:4px 2px 10px}
.situacaoHead h2{margin:0;color:#fff;font-size:18px;font-weight:950;letter-spacing:.01em}
.situacaoHead p{margin:4px 0 0;color:#9fb0c7;font-size:12px;line-height:1.4}
.situacaoHead .competencia{color:#b8d4f2;font-size:11px;font-weight:900;white-space:nowrap}

/* ── Placar executivo ── */
.placarGrid{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:12px;margin-bottom:12px}
.placarCard{background:var(--painel);border:1px solid var(--linha);border-radius:20px;padding:18px 20px}
.placarCard .pcLabel{font-size:10px;font-weight:950;letter-spacing:.14em;text-transform:uppercase;color:#9fb0c7;margin-bottom:8px}
.placarCard .pcPlacar{font-size:44px;font-weight:950;line-height:1;color:#fff;margin-bottom:6px}
.placarCard .pcPlacar span{font-size:20px;color:#6a8099;font-weight:700}
.placarCard .pcDesc{font-size:12px;color:#9fb0c7;line-height:1.35;margin-bottom:10px}
.placarCard .pcStatus{display:inline-flex;align-items:center;font-size:11px;font-weight:950;padding:4px 10px;border-radius:999px;border:1px solid}
.placarCard.estr{border-top:3px solid #5b9bd5}
.placarCard.cond{border-top:3px solid var(--amarelo)}
.placarCard.perf{border-top:3px solid var(--roxo)}
.placarCard.bonus{border-top:3px solid #5b9bd5;border-color:rgba(91,155,213,.4);background:rgba(91,155,213,.05)}
.placarCard.bonus .pcPlacar{font-size:clamp(72px,8vw,108px);font-weight:950;letter-spacing:-.05em;line-height:.9;color:#5b9bd5;margin-bottom:14px}
.placarCard.bonus .pcPlacar span{font-size:clamp(28px,3vw,40px);color:rgba(91,155,213,.6);font-weight:700}
.placarCard.bonus .pcLabel{font-size:11px;margin-bottom:14px}
.placarCard.bonus .pcDesc{font-size:11px;margin-bottom:14px}
.pcStatusOk{color:#83d99d;border-color:rgba(120,170,163,.4);background:rgba(120,170,163,.08)}
.pcStatusAtt{color:#ffa02b;border-color:rgba(255,160,43,.35);background:rgba(255,160,43,.07)}
.pcStatusCrit{color:#ff7d72;border-color:rgba(239,106,93,.35);background:rgba(239,106,63,.07)}
.pcStatusBloq{color:#6a8099;border-color:rgba(106,128,153,.3);background:rgba(106,128,153,.06)}

@media(max-width:1180px){.placarGrid{grid-template-columns:1fr 1fr}}
@media(max-width:760px){.placarGrid{grid-template-columns:1fr}}

.arRegua{background:var(--painel);border:1px solid var(--linha);border-radius:16px;padding:clamp(14px,3vw,24px)}
.arReguaTopo{display:flex;align-items:center;flex-wrap:wrap;gap:16px;margin-bottom:16px}
.arReguaNota{font:700 clamp(34px,6vw,56px)/1 "IBM Plex Mono",monospace;color:#fff}
.arReguaProxima{margin-left:auto;color:#ffc48c}
.arRegua small{display:block;color:#b3c6dd;margin-top:4px}
.arFaixas{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;padding:0;margin:0;list-style:none}
.arFaixas li{text-align:center;padding:8px 2px;border-top:3px solid #354c68}
.arFaixas [aria-current]{background:#203c5b;border-color:#82bfff}
.arFaixas .proxima{border-color:#ffb668;color:#ffc48c}
.arMetaResumo{border-bottom:1px solid var(--linha);padding:10px 4px}
.arMetaResumo summary,.arPremiacao summary{cursor:pointer;color:#e1edfc}
.arMetaResumo summary span{margin-left:8px;color:#b3c6dd}
.arMetaResumo p{margin:8px 0 0 16px;color:#b3c6dd;overflow-wrap:anywhere}
.arPremiacao{margin-top:16px}
@media(max-width:600px){.arReguaProxima{margin-left:0;width:100%}.arMetaResumo summary span{display:block;margin-left:16px}}
.arPrioridades{border:1px solid var(--linha);background:var(--painel);border-radius:14px;overflow:hidden}
.arPrioridade{display:grid;grid-template-columns:minmax(150px,1fr) minmax(0,3fr);gap:6px 20px;padding:14px 18px;border-bottom:1px solid var(--linha)}
.arPrioridade:last-child{border-bottom:0}
.arPrioridade .arMetaResumo{grid-column:1/-1;border:0;padding:0;font-size:12px}
.arAcao{display:grid;grid-template-columns:minmax(145px,1fr) 3fr;gap:8px 12px;margin-bottom:5px}
.arAcao strong{color:#ffc48c}
.arAcao span{color:#d1dfee}
@media(max-width:680px){.arPrioridade,.arAcao{grid-template-columns:1fr}.arAcao{gap:2px;margin-bottom:9px}}
.arTabela{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,310px),1fr));gap:14px;align-items:start}
.arLinhaMeta{background:var(--painel);border:1px solid var(--linha);border-radius:14px}
.arCardResumo{display:flex;flex-direction:column;gap:12px;padding:16px 18px}
.arCardResumo>strong{font-size:15px;color:#edf4fd}

.arRequisito+.arRequisito{margin-top:10px;padding-top:10px;border-top:1px solid var(--linha)}
.arRequisitoNome{display:block;color:#b3c6dd;font-size:12px}
.arRequisitoValores{display:flex;align-items:baseline;gap:6px 10px;flex-wrap:wrap;margin:3px 0 6px}
.arRequisitoValores strong{font:650 24px/1.2 "IBM Plex Mono",monospace;color:#edf4fd}
.arRequisitoValores span{font-size:12px;color:#b3c6dd}
.arVerDetalhes{align-self:flex-start;padding:4px 0;background:none;border:0;color:#9acbf2;font:inherit;font-size:12px;text-align:left;cursor:pointer}
.arVerDetalhes:hover{text-decoration:underline}
.arLinhaDetalhe{padding-top:12px;margin-top:14px;border-top:1px solid var(--linha);color:#b3c6dd;overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="app">

<!-- HEADER -->
<div id="header"></div>



<div id="loading" class="loading">Carregando indicadores publicados...</div>
<div id="errorState" class="emptyBlock" style="display:none"></div>

<main id="conteudo" style="display:none">

  <!-- SITUAÇÃO DAS METAS -->
  <div class="situacaoHead">
    <div>
      <h2>Situação das metas</h2>
      <p>Resultados do período e progresso em relação às metas do ano.</p>
    </div>
  </div>
  <div id="placarGrid"></div>

  <div id="indicadoresContainer"></div>
  <details class="arPremiacao"><summary>Memória de cálculo da premiação</summary>
    <section class="bonusPanel" id="bonusPanel"></section>
  </details>

</main>

<div id="footer"></div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════
   CONFIGURAÇÃO CENTRAL — METAS CASADAS E BONIFICAÇÃO
   ═══════════════════════════════════════════════════════════ */
const CASADOS = [
  {
    id: "par-02",
    label: "Meta dupla: Recuperação de Resíduos + Ranking Nacional",
    membros: ["E02","E03"],
    bonusNote: "Os dois precisam ser atingidos para que este par conte como uma meta na bonificação. O ranking nacional é apurado pela SINISA com dados do ano anterior. O resultado de 2026 só será publicado em 2027."
  },
  {
    id: "par-03",
    label: "Meta dupla: Atendimento 1746 Poda + Satisfação Poda",
    membros: ["E04","E05"],
    bonusNote: "São dois requisitos da mesma meta: atendimento igual ou superior a 95% no prazo e nota de satisfação igual ou superior a 4,5. Os dois precisam ser atingidos juntos."
  },
  {
    id: "par-04",
    label: "Meta dupla: Atendimento no prazo e satisfação na remoção de resíduos em logradouro",
    membros: ["E06","E07"],
    bonusNote: "São dois requisitos da mesma meta: atendimento igual ou superior a 85% no prazo em cada subprefeitura e satisfação igual ou superior a 4,4% para a cidade. Os dois precisam ser atingidos juntos."
  },
  {
    id: "par-c06",
    label: "Meta dupla (Condicionada): Conformidade IPL + Desvio Padrão IPL",
    membros: ["C01","C02"],
    bonusNote: "São dois requisitos da mesma meta: conformidade acumulada igual ou superior a 80% e desvio padrão entre gerências igual ou inferior a 5,9. Os dois precisam ser atingidos juntos."
  }
];

const BONUS_ESTRATEGICO = [

function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function norm(v){return String(v??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/\s+/g," ").trim();}
function key(v){return norm(v).replace(/[^a-z0-9]/g,"");}
function get(row,names,fallback=""){
  if(!row)return fallback;
  for(const n of names){if(row[n]!==undefined&&String(row[n]).trim()!=="")return row[n];}
  const dict={};Object.keys(row).forEach(k=>dict[key(k)]=k);
  for(const n of names){const k=dict[key(n)];if(k&&row[k]!==undefined&&String(row[k]).trim()!=="")return row[k];}
  return fallback;
}
function csv(url){
  return new Promise((resolve,reject)=>{
    Papa.parse(url,{download:true,header:true,skipEmptyLines:true,
      complete:r=>resolve((r.data||[]).filter(row=>Object.values(row).some(v=>String(v??"").trim()!==""))),
      error:reject});
  });
}
function num(v){
  if(v===null||v===undefined)return null;
  if(typeof v==="number"&&Number.isFinite(v))return v;
  let s=String(v).trim();
  if(!s||s==="-"||s==="—")return null;
  s=s.replace(/\s/g,"").replace("%","");
  if(s.includes(",")&&s.includes("."))s=s.replace(/\./g,"").replace(",",".");
  else if(s.includes(",")&&!s.includes("."))s=s.replace(",",".");
  else if(s.includes(".")&&!s.includes(",")){
    const pts=s.split(".");
    if(pts.length===2&&pts[1].length===3&&/^\d+$/.test(pts[0])&&/^\d+$/.test(pts[1]))
      s=pts[0]+pts[1];
  }
  const n=Number(s);return Number.isFinite(n)?n:null;
}
function isPercent(unidade){const u=norm(unidade);return u.includes("percent")||u==="%";}
function calcValue(v,unidade){let n=num(v);if(n===null)return null;if(isPercent(unidade)&&n>1.5)n=n/100;return n;}
function fmtValor(v,unidade){
  if(v===null||v===undefined||v==="")return "N/D";
  let n=Number(v);if(!Number.isFinite(n))n=num(v);if(n===null)return "N/D";
  if(isPercent(unidade)){if(n<=1.5)n=n*100;return n.toLocaleString("pt-BR",{maximumFractionDigits:1})+"%";}
  if(norm(unidade).includes("posi"))return n.toLocaleString("pt-BR",{maximumFractionDigits:0})+"º";
  if(Math.abs(n)>=1000)return n.toLocaleString("pt-BR",{maximumFractionDigits:0});
  return n.toLocaleString("pt-BR",{maximumFractionDigits:2});
}
function fmtPct(v){const n=Number(v);if(!Number.isFinite(n))return "N/D";return (n*100).toLocaleString("pt-BR",{maximumFractionDigits:1})+"%";}
function maiorMelhor(sentido){const s=norm(sentido);return s.includes("maior")||s.includes("↑")||s==="";}

function statusCanonico(atual,meta,sentido){
  if(atual===null||meta===null||atual===0||meta===0)return "Sem dado";
  const ating=maiorMelhor(sentido)?atual/meta:meta/atual;
  if(ating>=1)return "Dentro da Meta";
  if(ating>=.90)return "Atenção";
  return "Crítico";
}
function tagClass(status){
  const s=norm(status);
  if(s.includes("dentro")||s.includes("superado"))return "ok";
  if(s.includes("aten"))return "att";
  if(s.includes("critic"))return "crit";
  return "nd";
}
function grupoOrdem(grupo){
  const g=norm(grupo);
  if(g.includes("estrateg"))return 1;
  if(g.includes("condicion"))return 2;
  if(g.includes("performance"))return 3;
  return 9;
}

function montarMapeamento(){
  const map=new Map();
  RAW.map.forEach(r=>{
    const codigo=String(get(r,["Código_AR","Codigo_AR","Código","Codigo","Código AR","Codigo AR"])).trim();

      gerencia:String(get(r,["Filtro_Gerência","Filtro_Gerencia","Gerência","Gerencia"])).trim()
    });
  });
  return map;
}
function encontrarGeral(indicador,mapItem){
  const nomeMap=norm(mapItem?.indicadorGeral||""),nomeInd=norm(indicador.indicador);
  if(indicador.codigo==="E01"){
    const consolidadas=RAW.geral.filter(r=>
      String(get(r,["Ano"])).trim()==="2026" &&
      norm(get(r,["Indicador"]))==="pracas" &&
      norm(get(r,["Diretoria"]))==="comlurb" &&
      ["","-"].includes(norm(get(r,["Superint.","Superintendência","Superint"]))) &&
      ["","-"].includes(norm(get(r,["Gerência","Gerencia"])))
    );
    return consolidadas.length===1?consolidadas[0]:null;
  }
  const rows=RAW.geral.filter(r=>{
    const ano=String(get(r,["Ano"])).trim();
    if(ano&&ano!=="2026")return false;
    const nomeGeral=norm(get(r,["Indicador"]));
    if(nomeMap){if(nomeGeral!==nomeMap&&!nomeGeral.includes(nomeMap)&&!nomeMap.includes(nomeGeral))return false;}
    else{if(nomeGeral!==nomeInd&&!nomeGeral.includes(nomeInd)&&!nomeInd.includes(nomeGeral))return false;}
    const fDir=norm(mapItem?.diretoria||""),fSup=norm(mapItem?.superint||""),fGer=norm(mapItem?.gerencia||"");
    if(fDir&&fDir!=="-"&&norm(get(r,["Diretoria"]))!==fDir)return false;
    if(fSup&&fSup!=="-"&&norm(get(r,["Superint.","Superintendência","Superint"]))!==fSup)return false;
    if(fGer&&fGer!=="-"&&norm(get(r,["Gerência","Gerencia"]))!==fGer)return false;
    return true;
  });
  return rows[0]||null;
}
function valoresMensais(row,unidade){
  if(!row)return [];
  return MESES.map(m=>calcValue(get(row,[m]),unidade)).filter(v=>v!==null);
}
function tendenciaTexto(row,unidade,sentido){
  const vals=valoresMensais(row,unidade);
  if(vals.length<6)return "Série curta";
  const ult3=vals.slice(-3),ant3=vals.slice(-6,-3);
  const mediaUlt=ult3.reduce((s,v)=>s+v,0)/ult3.length,mediaAnt=ant3.reduce((s,v)=>s+v,0)/ant3.length;
  const dif=mediaUlt-mediaAnt;
  if(Math.abs(dif)<0.00001)return "Estável";
  const favoravel=maiorMelhor(sentido)?dif>0:dif<0;
  return favoravel?"Favorável":"Desfavorável";
}
function tendenciaClass(t){
  const x=norm(t);
  if(x.includes("favor"))return "ok";
  if(x.includes("desfavor"))return "crit";
  if(x.includes("estavel"))return "att";
  return "nd";
}

function e06Subprefeituras(){
  const prefixo="performance de atendimento de remocao de residuos -";
  const candidatas=RAW.geral.filter(r=>{
    if(String(get(r,["Ano"])).trim()!=="2026")return false;
    const indicador=norm(get(r,["Indicador"]));
    if(!indicador.startsWith(prefixo))return false;
    const nome=indicador.slice(prefixo.length).trim();
    // A linha “Subprefeituras” consolida as 12 regiões e não entra na apuração.
    return nome!==""&&nome!=="subprefeituras";
  });

  function serie(diretoria){
    const grupos=new Map();
    for(const row of candidatas.filter(r=>norm(get(r,["Diretoria"]))===diretoria)){
      const nome=String(get(row,["Indicador"])).replace(/^.*?\s-\s/i,"").trim();
      const vals=MESES.map(m=>calcValue(get(row,[m]),"%"));
      const acum=calcValue(get(row,["Acumulado"]),"%"),meta=calcValue(get(row,["Meta"]),"%");
      const mes=vals.reduce((n,v,i)=>v===null?n:i+1,0);
      if(!mes||acum===null||meta===null)continue;
      const k=norm(nome);
      if(!grupos.has(k))grupos.set(k,[]);
      grupos.get(k).push({nome,row,vals,acum,meta,mes,ok:acum>=meta});
    }
    const inteiro=n=>Math.abs(n*100-Math.round(n*100))<1e-8;
    const equiv=(a,b)=>Math.abs(a-b)<1e-9||
      (inteiro(a)&&Math.round(b*100)===Math.round(a*100))||
      (inteiro(b)&&Math.round(a*100)===Math.round(b*100));
    return [...grupos.values()].flatMap(g=>{
      g.sort((a,b)=>b.mes-a.mes||Number(inteiro(a.acum))-Number(inteiro(b.acum)));
      const s=g[0];
      return g.filter(x=>x.mes===s.mes).every(x=>x.meta===s.meta&&x.ok===s.ok&&equiv(x.acum,s.acum)&&equiv(x.vals[s.mes-1],s.vals[s.mes-1]))?[s]:[];
    });
  }
  const oficial=serie("comlurb"),dlu=serie("dlu");
  const periodo=s=>s.length===12&&s.every(x=>x.mes===s[0].mes)?s[0].mes:0;
  const fonte=periodo(dlu)>periodo(oficial)&&oficial.every(o=>dlu.some(d=>norm(o.nome)===norm(d.nome)))?dlu:oficial;
  return fonte.sort((a,b)=>a.nome.localeCompare(b.nome,"pt-BR"));
}
function aplicarRegraE06(d){
  const subs=e06Subprefeituras();
  if(!subs.length)return;
  const avaliadas=subs.filter(s=>s.acum!==null);
  const conformes=avaliadas.filter(s=>s.ok).length;
  const total=subs.length;
  const pct=total?conformes/total*100:null;
  d.e06Subs=subs;
  d.atual=pct;
  d.meta=100;
  d.metaProporcional=null;
  d.atingimento=pct===null?null:pct/100;
  d.atingimentoProporcional=false;
  d.unidade="%";
  d.status=pct===100?"Dentro da Meta":pct!==null?"Crítico":"Sem dado";
  d.statusDisplay=d.status;
  d.statusClass=tagClass(d.status);
  d.e06Conformes=conformes;
  d.e06Total=total;
  d.mesReferencia=total===12?MESES.reduce((ultimo,_,i)=>subs.every(s=>s.vals[i]!=null)?i+1:ultimo,null):null;
  if(total===12&&avaliadas.length===12&&d.mesReferencia>=10&&subs.every(s=>norm(get(s.row,["Diretoria"]))==="comlurb")){
    // A pendência de outubro por falta das séries caiu após a atualização da aba geral.
    if(/pendência out\/26:[\s\S]*12 séries regionais ausentes/i.test(d.pendencia||""))d.pendencia="";
  }
  if(subs.every(s=>norm(get(s.row,["Diretoria"]))==="dlu")){
    d.pendencia="Resultado calculado pelas séries regionais da DLU. Registro no consolidado oficial pendente.";
  }
  if(total!==12||avaliadas.length!==12){
    d.pendencia=d.pendencia||(total!==12
      ?`A base lista ${total} regiões, mas a meta prevê 12. É preciso conferir quais entram na apuração.`
      :`Só ${avaliadas.length} de 12 regiões têm resultado disponível.`);
  }
  // Tendência = comparação entre conformidade das subprefeituras no último mês e mês anterior.
  const mesesComDados=MESES.map((m,i)=>({i,vals:subs.map(s=>s.vals[i]).filter(v=>v!==null)})).filter(x=>x.vals.length);
  if(mesesComDados.length>=2){
    const calc=x=>x.vals.filter(v=>v>=85).length/subs.length*100;
    const a=calc(mesesComDados[mesesComDados.length-2]),b=calc(mesesComDados[mesesComDados.length-1]);
    d.tendencia=b>a?"Favorável":b<a?"Desfavorável":"Estável";
    d.tendenciaClass=tendenciaClass(d.tendencia);
  }else{d.tendencia="Série curta";d.tendenciaClass="nd";}
}

function competenciaAR(row, acumulado){
  const raw=norm(get(row,["Competência","Mês de referência","Mes de referencia"]));
  const partes=raw.match(/^(0?[1-9]|1[0-2])[/.-](?:20)?26$/);
  if(partes)return Number(partes[1]);
  const nome=raw.match(/^(\p{L}+)[ /.-]+(?:20)?26$/u);
  if(nome){
    const i=MESES.findIndex(m=>norm(m)===nome[1].slice(0,3));
    if(i>=0)return i+1;
  }
  if(acumulado&&String(get(row,["Ano"])).trim()==="2026"){
    return MESES.reduce((i,m,j)=>num(get(row,[m]))===null?i:j+1,0)||null;
  }
  return null;
}
function leituraRitmo(d){
  if(!Number.isFinite(d.referenciaRitmo)||!Number.isFinite(d.atual))return null;
  const delta=d.atual-d.referenciaRitmo;
  return Math.abs(delta)<1e-9?"No ritmo da meta":delta>0?"Acima do previsto para o período":"Abaixo do previsto para o período";
}
function processar(){
  const map=montarMapeamento();
  DATA=RAW.ar.map((r,idx)=>{
    const codigo=String(get(r,["Código","Codigo"])).trim()||`AR${idx+1}`;
    const d={
      codigo,
      grupo:String(get(r,["Grupo"],"Sem grupo")).trim()||"Sem grupo",
      ordem:num(get(r,["Ordem"]))??idx+1,
      indicador:String(get(r,["Indicador Executivo","Indicador_Executivo","Indicador"],codigo)).trim(),
      descricao:String(get(r,["Descrição Resumida","Descricao Resumida","Descrição","Descricao"])).trim(),
      unidade:String(get(r,["Unidade"])).trim(),
      sentido:String(get(r,["Sentido"],"maior_melhor")).trim(),
      metaRaw:get(r,["Meta_2026","Meta 2026","Meta"]),
      atualRaw:get(r,["Atual","Resultado Atual","Acumulado"]),
      fonte:String(get(r,["Fonte_Dados","Fonte Dados","Fonte"])).trim(),
      pendencia:String(get(r,["Pendência_Oficial","Pendencia Oficial","Pendência","Pendencia"])).trim(),
      tipoAcumulado:String(get(r,["Tipo_Acumulado","Tipo Acumulado"],"SOMA")).trim().toUpperCase(),
      periodicidade:String(get(r,["Periodicidade"],"Mensal")).trim()
    };
    const linha=encontrarGeral(d,map.get(codigo));
    if(codigo==="E06")d.indicador="Remoção de resíduos em logradouro no prazo, por subprefeitura";
    if(codigo==="E07")d.indicador="Satisfação com o atendimento";
    const usaLinha=codigo==="E01"||!d.atualRaw;
    d.mesReferencia=competenciaAR(usaLinha?linha:r,usaLinha);
    const volumeLinear=codigo==="E01"||(
      codigo!=="E06"&&codigo!=="E08"&&String(get(r,["Tipo_Acumulado","Tipo Acumulado"])).trim().toUpperCase()==="SOMA"&&
      norm(get(r,["Periodicidade"])).includes("mensal")&&maiorMelhor(d.sentido)
    );
    if(codigo==="C01"||codigo==="C02"){
      const usaAcumulado=!d.atualRaw;
      const ultimo=usaAcumulado&&linha?MESES.reduce((i,m,j)=>num(get(linha,[m]))===null?i:j,-1):-1;
      const ano=get(linha,["Ano"]);
      d.periodoIPL=String(get(usaAcumulado?linha:r,["Competência","Competencia","Mês de referência","Mes de referencia"])).trim()
        || (ultimo>=0&&String(ano)==="2026"?`Acumulado até ${MESES[ultimo]}/${ano}`:"");
    }
    if(linha){
      d.unidade=d.unidade||String(get(linha,["Unidade"])).trim();
      d.sentido=d.sentido||String(get(linha,["Sentido"],"maior_melhor")).trim();
      d.atualRaw=d.atualRaw||get(linha,["Acumulado"]);
      d.metaRaw=d.metaRaw||get(linha,["Meta"]);
    }
    // E01 usa uma única linha oficial da aba Geral (SARC), sem fallback para AR_2026.
    if(codigo==="E01"){
      d.atualRaw=get(linha,["Acumulado"]);
      d.metaRaw=get(linha,["Meta"]);
      d.fonte="SARC · aba Geral";
    }
    if(codigo==="E07"){
      d.unidade="%";
      if(d.pendencia)d.pendencia="Referência anterior: 3,9%. Meta: 4,4%. O resultado da competência ainda não foi validado.";
    }
    d.serie=MESES.map(m=>calcValue(get(linha,[m]),d.unidade));
    d.atual=calcValue(d.atualRaw,d.unidade);
    // Nos volumes, a série mensal pode datar o acumulado já exibido
    // somente quando o valor da linha mapeada coincide com ele.
    const acumuladoGeral=calcValue(get(linha,["Acumulado"]),d.unidade);
    if(volumeLinear&&!d.mesReferencia&&d.atual!==null&&acumuladoGeral!==null&&Math.abs(d.atual-acumuladoGeral)<1e-9){
      d.mesReferencia=competenciaAR(linha,true);
    }
    d.meta=calcValue(d.metaRaw,d.unidade);
    d.volumeLinear=volumeLinear&&!isPercent(d.unidade)&&!norm(d.unidade).includes("posi");
    d.referenciaRitmo=d.volumeLinear&&d.mesReferencia&&d.meta>0?d.meta*d.mesReferencia/12:null;
    if(d.atual!==null&&d.meta!==null&&d.meta!==0){
      if(codigo!=="E01"&&d.referenciaRitmo!==null){
        d.metaProporcional=d.referenciaRitmo;
        d.atingimento=d.metaProporcional>0?
          (maiorMelhor(d.sentido)?d.atual/d.metaProporcional:d.metaProporcional/d.atual):null;
        d.atingimentoProporcional=true;
      } else {
        d.metaProporcional=null;
        d.atingimento=maiorMelhor(d.sentido)?d.atual/d.meta:d.meta/d.atual;
        d.atingimentoProporcional=false;
      }
    } else {
      d.atingimento=null;d.metaProporcional=null;d.atingimentoProporcional=false;
    }

    const rawStatus=String(get(r,["Status"])).trim();
    if(codigo==="E01"){
      d.status=d.atual===0&&d.meta>0?"Crítico":statusCanonico(d.atual,d.meta,d.sentido);
      d.statusDisplay=d.status;
    } else if(rawStatus&&rawStatus!=="Indisponível"){
      d.status=(rawStatus==="Superado"||rawStatus==="Dentro da Meta")?"Dentro da Meta":
               rawStatus==="Atenção"?"Atenção":
               rawStatus==="Crítico"?"Crítico":"Sem dado";
      d.statusDisplay=d.status;
    } else {
      const metaRef=d.meta; // Cenário anual não usa o ritmo mensal.
      d.status=statusCanonico(d.atual,metaRef,d.sentido);
      d.statusDisplay=d.status;
    }

    // Distinção entre leitura gerencial e apuração contratual.
    // O ranking SINISA de 2026 só será conhecido no ano subsequente;
    // a Meta de Performance é apurada ao final do exercício pela CVL/GBP/SMIT.
    d.statusCenario=d.status;
    if(d.codigo==="E03"){
      d.statusDisplay="Em apuração";
      d.statusClass="nd";
    } else if(d.codigo==="P01"){
      d.statusDisplay="Em avaliação";
      d.statusClass="nd";
    } else {
      d.statusClass=tagClass(d.statusDisplay);
    }
    d.tendencia=tendenciaTexto(linha,d.unidade,d.sentido);
    d.tendenciaClass=tendenciaClass(d.tendencia);
    if(d.codigo==="E06")aplicarRegraE06(d);
    if((codigo!=="E01"&&rawStatus==="Indisponível") || d.pendencia){
      d.statusCenario="Sem dado";
    }

    const par=CASADOS.find(c=>c.membros.includes(codigo));
    d.casadoId=par?par.id:null;
    d.casadoLabel=par?par.label:null;

    return d;
  })
  .filter(d=>d.codigo||d.indicador)
  .sort((a,b)=>grupoOrdem(a.grupo)-grupoOrdem(b.grupo)||a.ordem-b.ordem);
}

/* ═══════════════════════════════════════════════════════════
   CÁLCULO DO CENÁRIO DE PREMIAÇÃO
   ═══════════════════════════════════════════════════════════ */
function calcularBonificacao(lista){
  const byId=Object.fromEntries(lista.map(d=>[d.codigo,d]));

  const estratIndividuais=["E01","E08"];
  const estratCasados=CASADOS.filter(c=>lista.some(d=>d.grupo.toLowerCase().includes("estrateg")&&c.membros.includes(d.codigo)));

  let metasEstrategicasAtingidas=0;
  const detalhesEstrategicos=[];

  estratIndividuais.forEach(cod=>{
    const d=byId[cod];
    if(!d)return;
    const atingiu=(d.statusCenario||d.status)==="Dentro da Meta";
    if(atingiu)metasEstrategicasAtingidas++;
    detalhesEstrategicos.push({cod,label:d.indicador,atingiu,casado:false});
  });

  estratCasados.forEach(par=>{
    const todos=par.membros.every(m=>{const d=byId[m];return d&&(d.statusCenario||d.status)==="Dentro da Meta";});
    if(todos)metasEstrategicasAtingidas++;
    detalhesEstrategicos.push({
      cod:par.membros.join("+"),
      label:par.label,
      atingiu:todos,
      casado:true,
      membros:par.membros.map(m=>({cod:m,indicador:byId[m]?.indicador||m,status:byId[m]?.statusDisplay||"Sem dado",statusClass:byId[m]?.statusClass||"nd"})),
      bonusNote:par.bonusNote
    });
  });

  const totalEstrategicas=estratIndividuais.filter(c=>byId[c]).length + estratCasados.length;
  const condicionalAtiva=metasEstrategicasAtingidas>=3;

  const regE=BONUS_ESTRATEGICO.find(r=>metasEstrategicasAtingidas>=r.metas)||BONUS_ESTRATEGICO[BONUS_ESTRATEGICO.length-1];

  const condIndividuais=["C03","C04"];
  const condCasados=CASADOS.filter(c=>lista.some(d=>d.grupo.toLowerCase().includes("condicion")&&c.membros.includes(d.codigo)));

  let metasCondicionadasAtingidas=0;
  const detalhesCondicionados=[];

  condIndividuais.forEach(cod=>{
    const d=byId[cod];
    if(!d)return;
    const atingiu=condicionalAtiva&&d.statusCenario==="Dentro da Meta";
    if(atingiu)metasCondicionadasAtingidas++;
    detalhesCondicionados.push({cod,label:d.indicador,atingiu,casado:false,bloqueado:!condicionalAtiva});
  });

  condCasados.forEach(par=>{
    const todos=condicionalAtiva&&par.membros.every(m=>{const d=byId[m];return d&&(d.statusCenario||d.status)==="Dentro da Meta";});
    if(todos)metasCondicionadasAtingidas++;
    detalhesCondicionados.push({
      cod:par.membros.join("+"),
      label:par.label,
      atingiu:todos,
      casado:true,
      bloqueado:!condicionalAtiva,
      membros:par.membros.map(m=>({cod:m,indicador:byId[m]?.indicador||m,status:byId[m]?.statusDisplay||"Sem dado",statusClass:byId[m]?.statusClass||"nd"})),
      bonusNote:par.bonusNote
    });
  });

  const regC=BONUS_CONDICIONADO.find(r=>metasCondicionadasAtingidas>=r.metas)||BONUS_CONDICIONADO[BONUS_CONDICIONADO.length-1];

  const p01=byId["P01"];
  // Meta de Performance não é projetada como cumprida durante o exercício.
  // O contrato prevê apuração conjunta ao final de 2026.
  const performanceAtingida=false;
  const bonusPerformance=0;

  const bonusTotal=regE.pct+(condicionalAtiva?regC.pct:0);
  const bonusPotencialMax=bonusTotal+(condicionalAtiva?BONUS_PERFORMANCE.pct:0);

  return {
    metasEstrategicasAtingidas,totalEstrategicas,
    regE,condicionalAtiva,
    metasCondicionadasAtingidas,regC,
    performanceAtingida,bonusPerformance,
    bonusTotal,bonusPotencialMax,
    detalhesEstrategicos,detalhesCondicionados
  };
}

function renderResumo(){
  const b=calcularBonificacao(DATA);
  const atual=b.metasEstrategicasAtingidas;
  const faixas=BONUS_ESTRATEGICO.filter(f=>f.metas>0).reverse();
  const proxima=faixas.find(f=>f.metas>atual);
  const nota=n=>n.toFixed(1).replace(".",",");
  const porCodigo=Object.fromEntries(DATA.map(d=>[d.codigo,d]));
  const resumos={E01:"Revitalização de Praças", "E02+E03":"Recuperação de Resíduos + Ranking",
    "E04+E05":"Poda", "E06+E07":"Remoção de Resíduos em Logradouro", E08:"Microdrenagem Urbana"};

  function situacao(d){
    if(!d)return "Sem dado";
    if(d.pendencia || d.statusCenario==="Sem dado")return "Apuração pendente";
    return d.statusDisplay;
  }

  const encaminhamentos={
    E02:["Concluir apuração","Conferir o percentual de recuperação frente à meta de 3,8%."],
    E03:["Acompanhar publicação","Confirmar a posição da cidade quando sair o ranking nacional."],
    E04:["Melhorar atendimento","Elevar o atendimento de poda no prazo até 95%."],
    E05:["Validar indicador","Confirmar a escala da satisfação de poda e verificar se a nota chega a 4,5."],
    E06:["Completar apuração regional","Conferir o atendimento no prazo nas 12 subprefeituras, na mesma competência. Todas precisam atingir a meta."],
    E07:["Validar indicador","Validar o resultado percentual da satisfação de remoção frente à meta de 4,4%."],
    E08:["Comprovar execução","Confirmar, ponto a ponto, a realização dos três ciclos de limpeza nos 50 pontos críticos. Sem comprovação, o ponto não conta para a meta."]
  };

  const metas=[...b.detalhesEstrategicos].sort((a,b)=>{
    const ordem=["E04+E05","E06+E07","E01","E08","E02+E03"];
    return Number(a.atingiu)-Number(b.atingiu)||ordem.indexOf(a.cod)-ordem.indexOf(b.cod);
  }).map(meta=>{
    const membros=meta.cod.split("+").map(c=>porCodigo[c]).filter(Boolean);
    const acoes=membros.filter(d=>situacao(d)!=="Dentro da Meta"&&!(d.codigo==="E01"&&d.atual!==null&&d.referenciaRitmo!==null&&d.atual>=d.referenciaRitmo)).map(d=>{
      const [tipo,acao]=d.codigo==="E01"
        ?d.atual===null?["Resultado indisponível","Confirmar o total de praças revitalizadas."]:
          d.referenciaRitmo!==null?["Produção abaixo do previsto","Revisar o ritmo de revitalização."]:["Verificar previsão","Confirmar a previsão de revitalizações para o período."]
        :d.codigo==="E06"&&d.statusCenario!=="Sem dado"
          ?["Atendimento no prazo",`Priorizar ${(d.e06Subs||[]).filter(s=>!s.ok).map(s=>s.nome).join(", ")||"as subprefeituras abaixo da meta"}.`]
          :encaminhamentos[d.codigo]||["Verificar resultado",d.indicador];
      return `<div class="arAcao"><strong>${esc(tipo)}</strong><span>${esc(acao)}</span></div>`;
    }).join("");
    return acoes?`<article class="arPrioridade">
      <header><strong>${esc(resumos[meta.cod]||meta.label)}</strong></header>
      <div>${acoes}</div>
    </article>`:"";
  }).join("");

  $("placarGrid").innerHTML=`
    <section class="arRegua" aria-label="Faixas de pontuação das metas estratégicas">
      <div class="arReguaTopo">
        <div class="arReguaNota">${atual?nota(b.regE.nota):atual+"/5"}</div>
        <div><strong>${atual?"Nota-base simulada":"Metas estratégicas favoráveis no cenário"}</strong>
        <small>${atual?`${atual} de 5 estratégicas · ${b.bonusTotal}% de bônus simulado`:"Sem faixa de nota-base no cenário disponível"}</small></div>
        <div class="arReguaProxima"><strong>${proxima?`Próxima faixa · nota ${nota(proxima.nota)}`:"Faixa estratégica máxima"}</strong>
        ${proxima?`<small>Requer mais 1 meta estratégica · ${proxima.pct}% de bônus das estratégicas</small>`:""}</div>
      </div>
      <ol class="arFaixas">${faixas.map(f=>`<li ${f.metas===atual?'aria-current="step"':f===proxima?'class="proxima"':""}>
        <small>${f.metas} ${f.metas===1?"meta":"metas"}</small><strong>${nota(f.nota)}</strong><small>${f.pct}%</small></li>`).join("")}</ol>
      <small>Condicionadas a partir de 3 estratégicas · Performance aguarda avaliação oficial.</small>
    </section>
    ${metas?`<h3>Pendências das metas estratégicas</h3><div class="arPrioridades">${metas}</div>`:""}`;
}

      '<span class="cod">'+esc(item.cod)+'</span>'+

      '<span></span>'+

  }

  function linhaCasada(item){
    var cls=item.atingiu?"ok":"crit";
    var statusTxt=item.bloqueado?"Bloqueado":(item.atingiu?"Favorável":"Pendente");
    var membrosHtml=item.membros.map(function(m){
      return '<div class="metaLinha '+esc(m.statusClass)+'" style="padding-left:20px">'+
        '<span class="cod">'+esc(m.cod)+'</span>'+

        '<span class="status-mini">'+esc(m.status)+'</span>'+

    return '<div class="metaLinha '+cls+'" style="flex-wrap:wrap">'+
        '<span class="cod">⊞</span>'+

        '<span class="status-mini">'+statusTxt+'</span>'+

  var condTotal=[...["C03","C04"].filter(function(c){return DATA.some(function(d){return d.codigo===c;});}),...CASADOS.filter(function(p){return p.membros.some(function(m){return DATA.some(function(d){return d.codigo===m&&d.grupo.toLowerCase().includes("condicion");});});})].length;
  var condDetalhe=b.condicionalAtiva
    ?"Ponto adicional no cenário atual: "+b.regC.ponto+"; "+b.regC.pct+"% adicional"
    :"Estas metas só são consideradas a partir de 3 estratégicas favoráveis no cenário atual";
  var condCls=b.condicionalAtiva?"ok":"nd";
  var condStyle=b.condicionalAtiva?"":"opacity:.6";
  var condLabel="Condicionadas"+(b.condicionalAtiva?"":" · Bloqueado");

  panel.innerHTML=
    '<div class="bonusPanelHead">'+
      '<h2>Cenário de premiação</h2>'+
      '<div class="hint">Simulação com os dados disponíveis. Não representa o resultado anual oficial.</div>'+
    '</div>'+
    '<div class="bonusGrid">'+
      '<div class="bonusCard">'+
        '<div class="label">Estratégicas</div>'+
        '<div class="valor">'+b.metasEstrategicasAtingidas+'/'+b.totalEstrategicas+'</div>'+
        '<div class="detalhe">Nota no cenário atual: <strong>'+b.regE.nota+'</strong>, equivalente a '+b.regE.pct+'% na faixa estratégica. Pares de indicadores contam como uma meta.</div>'+
      '</div>'+
      '<div class="bonusCard '+condCls+'" style="'+condStyle+'">'+
        '<div class="label">'+condLabel+'</div>'+

        '<div class="detalhe">'+condDetalhe+'</div>'+
      '</div>'+
    '</div>'+
    '<div class="metaContagem">'+
      '<div class="tituloContagem">Detalhamento por meta: Estratégicas</div>'+
      '<div class="metaLinhas">'+detalheLinhas(b.detalhesEstrategicos)+'</div>'+

      '<div class="tituloContagem">Detalhamento por meta: Condicionadas'+(b.condicionalAtiva?"":" (bloqueadas)")+'</div>'+
      '<div class="metaLinhas">'+detalheLinhas(b.detalhesCondicionados)+'</div>'+

}

function renderIndicadores(){
  const grupos=[...new Set(DATA.map(d=>d.grupo))];
  const nomes={"par-02":"Recuperação de Resíduos + Ranking","par-03":"Poda",
    "par-04":"Remoção de Resíduos em Logradouro","par-c06":"Índice Padrão de Limpeza"};
  if(!grupos.length){
    $("indicadoresContainer").innerHTML='<div class="emptyBlock">Nenhuma meta disponível.</div>';
    return;
  }
  $("indicadoresContainer").innerHTML=grupos
    .sort((a,b)=>grupoOrdem(a)-grupoOrdem(b)).map(grupo=>{
      const metas=new Map();
      DATA.filter(d=>d.grupo===grupo).forEach(d=>{
        const chave=d.casadoId||d.codigo;
        if(!metas.has(chave))metas.set(chave,[]);
        metas.get(chave).push(d);
      });
      const linhas=[...metas.entries()];
      return `<section class="arBlock">
        <div class="arBlockHead"><h2 class="arBlockTitle">${esc(grupo)}</h2></div>
        <div class="arTabela">${linhas.map(([chave,itens])=>{
          const par=CASADOS.find(c=>c.id===chave);
          const e06=itens.find(d=>d.codigo==="E06");
          const requisitos=itens.map(d=>{
            if(d.codigo==="C01"||d.codigo==="C02"){
              const minimo=d.codigo==="C01";
              const comResultado=Number.isFinite(d.atual);
              const comMeta=Number.isFinite(d.meta);
              const exibe=v=>minimo?(v*100).toLocaleString("pt-BR",{maximumFractionDigits:2})+"%":fmtValor(v,d.unidade);
              const diferenca=comResultado&&comMeta?(minimo?d.atual-d.meta:d.meta-d.atual):null;
              const magnitude=diferenca===null?"":(Math.abs(diferenca)*(minimo?100:1)).toLocaleString("pt-BR",{maximumFractionDigits:2})+(minimo?" p.p.":"");
              const distancia=diferenca===null?"":Math.abs(diferenca)<1e-9?"No valor da meta":minimo
                ?diferenca<0?`Faltam ${magnitude} para a meta`:`${magnitude} acima da meta`
                :diferenca<0?`${magnitude} acima do limite`:`${magnitude} abaixo do limite`;
              const pendente=comResultado&&d.statusCenario==="Sem dado";
              return `<div class="arRequisito">
                <span class="arRequisitoNome">${esc(d.indicador)}</span>
                <div class="arRequisitoValores">
                  <strong>${comResultado?esc(exibe(d.atual)):"Sem resultado"}</strong>
                  ${comResultado?`<span>${esc(d.periodoIPL||"Competência não informada")}</span>`:""}
                  <span>${comMeta?esc((minimo?"Meta mínima: ":"Limite máximo: ")+exibe(d.meta)):"Meta não informada"}</span>
                </div>
                ${distancia?`<span class="tag ${pendente?"nd":diferenca<0?"crit":"ok"}">${esc(distancia)}</span>`:""}
                ${pendente?'<span class="tag nd">Validação pendente</span>':""}
              </div>`;
            }
            const pendente=d.statusCenario==="Sem dado";
            const resultado=d.atual===null?"":fmtValor(d.atual,d.unidade);
            const ritmo=leituraRitmo(d);
            const periodo=d.mesReferencia?`${MESES[d.mesReferencia-1]}/2026`:"";
            const referencia=d.codigo==="E06"?"12 de 12 subprefeituras":d.codigo==="E08"?fmtValor(d.meta,d.unidade)+" pontos com três ciclos cada":fmtValor(d.meta,d.unidade);
            const semResultado=d.codigo==="E07"?"Resultado ainda não validado":d.codigo==="E08"?"Execução ainda não comprovada":"Sem resultado registrado";
            const situacao=!resultado?semResultado:d.codigo==="E06"&&d.e06Total&&d.e06Total!==12
              ?`A base lista ${d.e06Total} regiões; a meta prevê 12`:pendente?"Validação pendente":
              ritmo||(d.volumeLinear?"Sem referência para o período":d.statusDisplay==="Crítico"?"Fora da meta":d.statusDisplay);
            const regionalCompleta=d.codigo==="E06"&&d.e06Total===12&&d.mesReferencia&&!pendente;
            const situacaoFinal=regionalCompleta?(d.e06Conformes===12?"Meta atingida":"Meta ainda não atingida"):situacao;
            const restanteRegional=regionalCompleta&&d.e06Conformes<12?12-d.e06Conformes:0;
            const podeComparar=!d.volumeLinear&&d.codigo!=="E06"&&!pendente&&Number.isFinite(d.atual)&&Number.isFinite(d.meta);
            const diferenca=podeComparar?(maiorMelhor(d.sentido)?d.meta-d.atual:d.atual-d.meta):0;
            const falta=diferenca>1e-9?(isPercent(d.unidade)?(100*diferenca).toLocaleString("pt-BR",{maximumFractionDigits:2})+" p.p.":fmtValor(diferenca,"")):"";
            const classe=pendente||!resultado?"nd":ritmo?(d.atual+1e-9>=d.referenciaRitmo?"ok":"crit"):d.volumeLinear?"nd":d.statusClass;
            return `<div class="arRequisito">
              ${itens.length>1?`<span class="arRequisitoNome">${esc(d.indicador)}</span>`:""}
              <div class="arRequisitoValores">${resultado?`<strong>${esc(d.codigo==="E06"?`${d.e06Conformes??0} de ${d.e06Total??0} regiões atingiram a meta`:resultado)}</strong>`:""}
                ${resultado&&periodo?`<span>Referência: ${esc(periodo)}</span>`:""}
                ${ritmo?`<span>Previsto até ${esc(periodo)}: ${esc(fmtValor(d.referenciaRitmo,d.unidade))}</span>`:""}
                <span>${d.volumeLinear?"Meta anual":d.codigo==="E08"?"Meta":d.codigo==="E06"?"Meta":maiorMelhor(d.sentido)?"Meta mínima":"Limite máximo"}: ${esc(referencia)}</span>
                ${restanteRegional?`<span>${restanteRegional===1?"Falta 1 subprefeitura":`Faltam ${restanteRegional} subprefeituras`}</span>`:""}
                ${falta?`<span>${maiorMelhor(d.sentido)?"Abaixo da meta em":"Acima do limite em"} ${esc(falta)}</span>`:""}
                ${d.volumeLinear&&resultado&&d.meta>d.atual?`<span>Faltam ${esc(fmtValor(d.meta-d.atual,d.unidade))} até dezembro</span>`:""}
              </div>
              <span class="tag ${esc(classe)}">${esc(situacaoFinal)}</span>
            </div>`;
          }).join("");
          const titulo=nomes[chave]||itens[0].indicador;
          const id=e06?"e06Drill":`arDetalhe-${esc(chave)}`;
          const notas=`<div class="arLinhaDetalhe">
            ${itens.map(d=>`<p><strong>${esc(d.codigo+" · "+d.indicador)}</strong> · ${esc(d.pendencia||d.descricao||(d.codigo==="E01"?"Revitalizações registradas no acumulado do ano.":d.fonte))}</p>`).join("")}
            ${par?`<p>${esc(par.bonusNote)}</p>`:""}
          </div>`;
          const conteudo=e06?renderE06Drill(e06)+notas:requisitos+renderHistoricoIndicadores(itens)+notas;
          return `<article class="arLinhaMeta"><div class="arCardResumo">
            <strong>${esc(titulo)}</strong><div>${requisitos}</div>
            <button class="arVerDetalhes" type="button" aria-controls="${id}" aria-haspopup="dialog" aria-label="Ver critérios e dados: ${esc(titulo)}">Ver critérios e dados ›</button>
          </div>${renderARDialog(id,titulo,conteudo)}</article>`;
        }).join("")}</div></section>`;
    }).join("");
}

/* ═══════════════════════════════════════════════════════════
   RENDER COMPLETO
   ═══════════════════════════════════════════════════════════ */
function render(){
  renderResumo();
  renderBonus();
  renderIndicadores();
  bindARDialogs();
}
/* ═══════════════════════════════════════════════════════════
   INICIALIZAÇÃO
   ═══════════════════════════════════════════════════════════ */
async function init(){
  HUB.header.render("header", {
    systemLabel: "HUB COMLURB · ACORDO DE RESULTADOS",
    title: "Acordo de Resultados 2026",
    subtitle: "Acompanhamento dos indicadores pactuados, situação das metas e cenário de premiação do Acordo de Resultados 2026."
  });
  HUB.footer.render("footer");
  const mostrarErro=(fonte,msg)=>{
    $("loading").style.display="none";
    $("errorState").style.display="block";
    $("errorState").innerHTML=`
      <strong style="color:#ff7d72">Falha ao carregar dados</strong><br>
      <span style="color:#c7d8ee;font-size:12px">Fonte: <code>${fonte}</code></span><br>
      <span style="color:#9fb0c7;font-size:11px;margin-top:6px;display:block">${msg}</span><br>
      <span style="color:#7a9bbf;font-size:11px">
        Verifique se a planilha está publicada como CSV no Google Sheets
        (Arquivo → Compartilhar → Publicar na web → CSV) e se o GID está correto.
      </span>`;
  };
  try{
    $("loading").textContent="Carregando aba geral...";
    const geral=await csv(URLS.geral).catch(e=>{throw Object.assign(e,{fonte:"geral"});});
    $("loading").textContent="Carregando aba AR_2026...";
    const ar=await csv(URLS.ar).catch(e=>{throw Object.assign(e,{fonte:"ar"});});
    $("loading").textContent="Carregando mapeamento...";
    const map=await csv(URLS.map).catch(e=>{throw Object.assign(e,{fonte:"map"});});
    RAW={geral,ar,map};
    processar();
    render();
    $("loading").style.display="none";
    $("conteudo").style.display="block";
    HUB.footer.updateTimestamp();
  }catch(e){
    console.error(e);
    mostrarErro(e.fonte||"desconhecida", e.message||String(e));
  }
}
document.addEventListener("DOMContentLoaded",init);
</script>
</body>
</html>
