<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Governança Corporativa · HUB COMLURB</title>
  <link rel="stylesheet" href="../assets/css/hub-premium.css">
  <link rel="stylesheet" href="governanca.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="../assets/components/hub-utils.js"></script>
  <script src="../assets/components/hub-layout.js"></script>
  <script src="../assets/components/hub-cards.js"></script>
  <script src="../assets/components/hub-filters.js"></script>
  <script src="../assets/js/indicadores-registro.js"></script>
  <script src="data.js"></script>
</head>
<body>
  <div class="app governancaApp">
    <div id="hubHeader"></div>

    <section class="governancaToolbar" aria-label="Filtros e navegação">
      <div class="filters governancaFilters">
        <div class="field"><label for="filtroAno">Ano</label><select id="filtroAno"></select></div>
        <div class="field"><label for="filtroDiretoria">Diretoria</label><select id="filtroDiretoria"></select></div>
        <div class="field searchField"><label for="buscaIndicador">Buscar indicador</label><input id="buscaIndicador" type="search" placeholder="Nome ou eixo"></div>
        <div class="field"><label for="filtroStatus">Status</label><select id="filtroStatus"><option value="todos">Todos</option><option value="green">Dentro da meta</option><option value="orange">Em atenção</option><option value="red">Críticos</option><option value="sem">Sem leitura</option></select></div>
      </div>
      <div class="toolbarActions"><a class="actionBtn homeLink" href="../index.html">Voltar para a Home</a><span id="dataStatus" class="dataStatus">Carregando dados</span></div>
    </section>

    <div id="loading"></div>
    <div id="errorState" class="governancaError" hidden></div>

    <main id="conteudo" hidden>
      <section id="kpisResumo" class="kpis" aria-label="Resumo corporativo"></section>

      <section class="panel situacaoPanel">
        <div class="panelHead"><div><h2>Centro de Situação</h2><div class="hint">Leitura consolidada do recorte selecionado</div></div></div>
        <div class="body"><div id="govNote" class="govNote"></div></div>
      </section>

      <section class="panel radarPanel">
        <div class="panelHead"><div><h2>Situação por eixo</h2><div id="radarHint" class="hint">Status corporativo</div></div></div>
        <div class="body" id="radarRows"></div>
      </section>

      <section class="indicadoresSection">
        <div class="sectionHeader"><div><h2>Indicadores</h2><p>Selecione um card para consultar meta, sentido, variação e série mensal.</p></div></div>
        <div id="indicadoresContainer"></div>
      </section>
    </main>

    <div id="hubFooter"></div>
  </div>

  <div class="drawerOverlay" id="drawerOverlay"></div>
  <aside class="drawer" id="drawer" aria-hidden="true" aria-labelledby="drawerTitulo">
    <button class="drawerClose" id="drawerClose" aria-label="Fechar ficha">×</button>
    <div class="drawerKicker" id="drawerEixo">Indicador</div>
    <h2 id="drawerTitulo">Indicador</h2>
    <div class="detailGrid" id="drawerDetails"></div>
    <div class="drawerKicker drawerCyclesTitle">Últimos ciclos</div>
    <div class="months" id="drawerMonths"></div>
  </aside>

  <script src="app.js"></script>
</body>
</html>
