<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestão Estratégica de Pessoas | HUB COMLURB</title>

  <link rel="stylesheet" href="../assets/css/hub-premium.css">

  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; max-width: 100%; overflow-x: hidden; }
    body { margin: 0; }
    .app { width: 100%; max-width: 100%; min-width: 0; }

    .unavailableWrap {
      display: flex;
      justify-content: center;
      padding: 40px 18px 60px;
    }
    .unavailableCard {
      max-width: 640px;
      width: 100%;
      text-align: center;
      padding: 40px 32px;
    }
    .unavailableCard .hint {
      margin-top: 14px;
      font-size: 14px;
      line-height: 1.6;
    }
    .unavailableBadge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid var(--linha);
      font-size: 12px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #c7d8ee;
      margin-bottom: 18px;
    }
  </style>
</head>

<body>
  <div class="app">

    <div id="header"></div>

    <div class="unavailableWrap">
      <div class="panel unavailableCard">
        <div class="body">
          <span class="unavailableBadge">Módulo temporariamente indisponível</span>
          <h2>Gestão Estratégica de Pessoas</h2>
          <div class="hint">
            Este módulo está em revisão para adequação à LGPD e será republicado
            somente com indicadores agregados, sem dados individuais de servidores.
            Nenhuma base pessoal é carregada nesta página.
          </div>
        </div>
      </div>
    </div>

    <div id="footer"></div>

  </div>

  <script src="../assets/components/hub-utils.js"></script>
  <script src="../assets/components/hub-layout.js"></script>

  <script>
    HUB.header.render("header", {
      systemLabel: "HUB COMLURB",
      title: "Gestão Estratégica de Pessoas",
      subtitle: "Módulo temporariamente indisponível"
    });

    HUB.footer.render("footer", {});
  </script>
</body>
</html>
