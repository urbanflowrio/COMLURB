<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Território Operacional | HUB COMLURB</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="../assets/css/hub-premium.css">


<style>
:root{
  --territorial-gap:16px;
  --territorial-soft:rgba(255,255,255,.055);
  --territorial-line:rgba(151,184,216,.18);
  --territorial-blue:#6aa7df;
}

/* ===== Territorial shell ===== */
.app{
  max-width:1720px;
}
.viewDock{
  position:sticky;
  top:8px;
  z-index:900;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  padding:8px 10px;
  margin:0 0 14px;
  border:1px solid var(--territorial-line);
  border-radius:15px;
  background:rgba(6,17,31,.88);
  backdrop-filter:blur(16px);
}
.viewDockLabel{
  padding-left:4px;
  color:#8faac5;
  font-size:10px;
  font-weight:800;
  letter-spacing:.13em;
  text-transform:uppercase;
  white-space:nowrap;
}
.layerTabs{
  display:flex;
  align-items:center;
  gap:4px;
  min-width:0;
  overflow-x:auto;
  scrollbar-width:none;
}
.layerTabs::-webkit-scrollbar{display:none}
.layerTab{
  flex:0 0 auto;
  border:0;
  background:transparent;
  color:#9fb6ce;
  border-radius:10px;
  padding:9px 13px;
  font-size:11px;
  font-weight:800;
  letter-spacing:.02em;
  cursor:pointer;
  transition:.16s ease;
  white-space:nowrap;
}
.layerTab:hover{background:rgba(91,155,213,.09);color:#eaf4ff}
.layerTab.active{
  background:rgba(91,155,213,.16);
  color:#fff;
  box-shadow:inset 0 0 0 1px rgba(111,167,216,.34);
}

/* ===== Filters ===== */
.filtersShell{display:none;margin-bottom:12px}
.filtersShell.active{display:block}
.filterGroup{
  border:1px solid var(--territorial-line);
  background:rgba(10,27,49,.62);
  border-radius:15px;
  padding:12px;
  margin-bottom:8px;
}
.filterGroup:last-child{margin-bottom:0}
.filterGroupHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}
.filterGroupTitle{
  font-size:10px;
  letter-spacing:.13em;
  text-transform:uppercase;
  color:#91abc5;
  font-weight:800;
}
.filterGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.filterGrid.secondary{grid-template-columns:repeat(4,minmax(0,1fr))}
.field{
  min-width:0;
  padding:10px 11px!important;
  border-radius:12px!important;
  border-color:rgba(151,184,216,.14)!important;
  background:rgba(13,31,54,.68)!important;
}
.field label{margin-bottom:5px!important;font-size:9px!important;letter-spacing:.12em!important;color:#86a3bf!important}
.field select,.field input{
  width:100%;
  min-width:0;
  font-size:13px!important;
  font-weight:700!important;
  color:#f2f7ff!important;
}
.filterActions{display:flex;gap:8px;align-items:end}
.filterActions .actionBtn{width:100%}
.actionBtn{
  border-radius:12px!important;
  padding:10px 13px!important;
  font-size:11px!important;
  background:rgba(10,27,49,.76)!important;
}
.mobileFilterToggle{display:none;width:100%;margin-top:8px}
#secondaryFilters{display:block}

/* ===== Context / breadcrumb ===== */
.breadcrumbBar{
  display:flex;
  align-items:center;
  gap:5px;
  flex-wrap:wrap;
  margin:2px 0 10px;
  min-height:26px;
}
.crumbLabel{font-size:9px;color:#718da9;text-transform:uppercase;letter-spacing:.12em;font-weight:800;margin-right:2px}
.crumbBtn{border:0;background:transparent;color:#b6c9dc;padding:4px 2px;font-size:11px;font-weight:700;cursor:pointer}
.crumbBtn:hover{color:#fff}
.crumbCurrent{color:#fff}
.crumbSep{color:#4c6985;font-size:10px}
.contextStrip{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:8px 11px;
  border:1px solid var(--territorial-line);
  border-radius:11px;
  background:rgba(6,17,31,.34);
  margin-bottom:12px;
}
.contextMain{min-width:0}
.contextTitle{font-size:11px;font-weight:800;color:#eef6ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.contextSub{font-size:10px;color:#839eb9;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.contextReset{border:0;background:transparent;color:#8fc0ea;font-size:10px;font-weight:800;cursor:pointer;white-space:nowrap}

/* ===== KPI strip: intentionally lighter than global HUB cards ===== */
#kpis.kpis{
  display:grid!important;
  grid-template-columns:repeat(4,minmax(0,1fr))!important;
  gap:9px!important;
  margin-bottom:12px!important;
}
#kpis .kpi{
  min-height:96px!important;
  padding:14px 15px!important;
  border-radius:15px!important;
  border-color:var(--territorial-line)!important;
  background:rgba(10,27,49,.68)!important;
  box-shadow:none!important;
}
#kpis .kpi.feature{
  background:linear-gradient(135deg,rgba(18,54,92,.72),rgba(10,27,49,.78))!important;
}
#kpis .kpi .label{
  min-height:auto!important;
  font-size:9px!important;
  letter-spacing:.09em!important;
  -webkit-line-clamp:2!important;
  color:#8ea9c4!important;
}
#kpis .kpi .value,
#kpis .kpi.feature .value{
  margin:7px 0 2px!important;
  font-size:clamp(25px,2vw,31px)!important;
  font-weight:850!important;
}
#kpis .kpi .note{
  font-size:10px!important;
  color:#91a9c1!important;
  -webkit-line-clamp:2!important;
}

/* ===== Main workspace ===== */
.mapGrid{
  display:grid;
  grid-template-columns:minmax(0,1.75fr) minmax(330px,.72fr);
  gap:var(--territorial-gap);
  align-items:start;
}
.mapPanel{
  position:relative;
  overflow:hidden;
  padding:0!important;
  min-width:0;
  min-height:0!important;
  border-radius:18px!important;
  border-color:var(--territorial-line)!important;
}
#map{
  height:clamp(520px,66vh,720px);
  width:100%;
  background:var(--painel2);
}
.leaflet-container{background:var(--painel2);font-family:"Segoe UI",Arial,sans-serif}
.leaflet-control-zoom a{background:rgba(10,27,49,.94)!important;color:#fff!important;border-color:rgba(151,184,216,.22)!important}
.leaflet-control-attribution{background:rgba(6,17,31,.78)!important;color:#718aa4!important;font-size:9px}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#0a1b31;color:#fff;border:1px solid rgba(151,184,216,.25);box-shadow:0 12px 34px rgba(0,0,0,.26)}
.popupTitle{font-size:13px;font-weight:850;margin-bottom:7px;color:#fff}
.popupLine{font-size:11px;color:#bed0e3;margin:3px 0;line-height:1.45}
.popupLine b{color:#fff}
.popupAction{
  margin-top:9px;
  width:100%;
  border:1px solid rgba(106,167,223,.48);
  background:rgba(36,79,130,.7);
  color:#fff;
  border-radius:9px;
  padding:8px 9px;
  font-size:10px;
  font-weight:800;
  cursor:pointer
}
.leaflet-tooltip.unitLabel{
  background:rgba(6,17,31,.8);
  border:1px solid rgba(151,184,216,.18);
  color:#dcecff;
  font-size:9px;
  font-weight:750;
  padding:2px 5px;
  border-radius:5px;
  box-shadow:none;
  pointer-events:none
}
.leaflet-tooltip.unitLabel:before{border-right-color:rgba(6,17,31,.8)}
#map:not(.zoomedIn) .leaflet-tooltip.unitLabel{display:none}
.mapLegend{
  position:absolute;
  left:10px;
  bottom:10px;
  z-index:500;
  max-width:calc(100% - 20px);
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  padding:7px 8px;
  border-radius:11px;
  background:rgba(6,17,31,.78);
  border:1px solid rgba(151,184,216,.17);
  backdrop-filter:blur(10px)
}
.mapLegend span{font-size:9px;color:#9db2c7;display:flex;align-items:center;gap:4px;white-space:nowrap}
.legendDot{width:6px;height:6px;border-radius:999px;display:inline-block}

/* ===== Executive explorer ===== */
.executivePanel{
  min-height:0!important;
  border-radius:18px!important;
  border-color:var(--territorial-line)!important;
  background:rgba(10,27,49,.72)!important;
  overflow:hidden;
}
.executivePanel .panelHead{
  padding:14px 15px!important;
  border-bottom-color:var(--territorial-line)!important;
  align-items:flex-start!important;
}
.executiveTitleWrap{min-width:0}
.executivePanel h2{font-size:15px!important;font-weight:850!important}
.executivePanel .hint{font-size:10px!important;color:#809bb6!important;margin-top:3px!important}
.executivePanel .body{padding:14px 15px 15px!important}
.explorerModes{
  display:flex;
  gap:4px;
  margin-bottom:12px;
  padding:3px;
  border:1px solid rgba(151,184,216,.12);
  border-radius:10px;
  background:rgba(6,17,31,.32);
}
.explorerMode{
  flex:1;
  border:0;
  background:transparent;
  color:#809bb6;
  padding:7px 6px;
  border-radius:8px;
  font-size:9px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.06em;
  cursor:pointer;
}
.explorerMode.active{background:rgba(91,155,213,.14);color:#edf6ff}
.territorialNote{
  color:#b5c8da!important;
  font-size:11px!important;
  line-height:1.5!important;
  padding:0 0 10px;
}
.territorialNote b{color:#f2f8ff}
.explorerMeta{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin:4px 0 8px;
}
.sideTitle{
  font-size:9px;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:#7894af;
  font-weight:800;
  margin:0;
}
.drillPill{
  display:inline-flex;
  align-items:center;
  gap:5px;
  border:1px solid rgba(106,167,223,.2);
  background:rgba(91,155,213,.08);
  color:#a8cbea;
  border-radius:999px;
  padding:4px 7px;
  font-size:9px;
  font-weight:750;
  white-space:nowrap;
}
.chartWrap{height:185px;position:relative;margin:0 0 12px}
.emptyChart{height:100%;display:flex;align-items:center;justify-content:center;color:#7890a8;font-size:11px;text-align:center;padding:18px}
.rankHint{font-size:9px;color:#6f8aa5;margin:2px 0 8px}
.territorialRank{display:grid!important;gap:6px!important}
.territorialRow{
  display:grid!important;
  grid-template-columns:minmax(0,1fr) auto!important;
  grid-template-areas:
    "name num"
    "track pct"!important;
  gap:5px 9px!important;
  align-items:center!important;
  padding:8px 9px!important;
  border-radius:10px!important;
  background:rgba(255,255,255,.025)!important;
  border:1px solid rgba(151,184,216,.09)!important;
  cursor:pointer;
  transition:.15s ease;
}
.territorialRow:hover{
  background:rgba(91,155,213,.07)!important;
  border-color:rgba(106,167,223,.24)!important;
  transform:none!important;
}
.territorialRow.is-static{cursor:default}
.territorialRow.is-static:hover{background:rgba(255,255,255,.025)!important;border-color:rgba(151,184,216,.09)!important}
.territorialName{
  grid-area:name;
  min-width:0;
  font-size:10px!important;
  font-weight:750!important;
  color:#dce8f4!important;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap
}
.territorialNum{grid-area:num;font-size:10px!important;font-weight:850!important;color:#f4f8fd!important}
.territorialTrack{
  grid-area:track;
  height:4px!important;
  border-radius:999px!important;
  overflow:hidden;
  background:rgba(255,255,255,.07)!important
}
.territorialFill{
  height:100%;
  border-radius:999px!important;
  background:linear-gradient(90deg,#3976ad,#6aa7df)!important
}
.territorialPct{grid-area:pct;font-size:9px!important;color:#7690aa!important;text-align:right!important}

/* ===== Responsive ===== */
@media (max-width:1180px){
  .mapGrid{grid-template-columns:minmax(0,1.45fr) minmax(310px,.8fr)}
  .filterGrid,.filterGrid.secondary{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:900px){
  .app{padding:18px!important}
  .mapGrid{grid-template-columns:1fr}
  .executivePanel{order:2}
  #map{height:530px}
  #kpis.kpis{grid-template-columns:repeat(2,minmax(0,1fr))!important}
  .chartWrap{height:210px}
}
@media (max-width:640px){
  .app{padding:10px!important}
  .header{padding:16px!important;border-radius:16px!important;margin-bottom:10px!important}
  .mainTitle{font-size:26px!important}
  .subtitle{font-size:12px!important}
  .logoImg{width:190px!important;max-height:60px!important;padding-right:14px!important}

  .viewDock{
    top:5px;
    padding:6px;
    border-radius:12px;
    margin-bottom:9px;
  }
  .viewDockLabel{display:none}
  .layerTabs{width:100%}
  .layerTab{flex:1 0 auto;text-align:center;padding:8px 9px;font-size:10px}

  .filterGroup{padding:9px;border-radius:12px}
  .filterGrid,.filterGrid.secondary{grid-template-columns:1fr}
  .mobileFilterToggle{display:block}
  #secondaryFilters{display:none}
  #secondaryFilters.open{display:block}
  .contextStrip{align-items:flex-start}
  .contextSub{white-space:normal}
  #kpis.kpis{gap:7px!important}
  #kpis .kpi{min-height:82px!important;padding:11px 12px!important;border-radius:12px!important}
  #kpis .kpi .value,#kpis .kpi.feature .value{font-size:24px!important}
  #kpis .kpi .note{font-size:9px!important}
  .mapGrid{gap:10px}
  .mapPanel,.executivePanel{border-radius:14px!important}
  #map{height:400px}
  .mapLegend{left:7px;bottom:7px;max-width:calc(100% - 14px)}
  .executivePanel .panelHead{padding:12px!important}
  .executivePanel .body{padding:12px!important}
  .chartWrap{height:190px}
  .breadcrumbBar{gap:3px}
  .crumbBtn{font-size:10px}
}
@media (max-width:390px){
  .app{padding:8px!important}
  #map{height:360px}
  #kpis.kpis{grid-template-columns:1fr 1fr!important}
  .layerTab{font-size:9px;padding:8px 7px}
}
</style>

</head>

<body>
<div class="app">
  <div id="header"></div>

  <div class="viewDock">
    <div class="viewDockLabel">Visão territorial</div>
    <div class="layerTabs" id="layerTabs"></div>
  </div>

  <section class="filtersShell" id="filtrosUnidades">
    <div class="filterGroup">
      <div class="filterGroupHead">
        <div class="filterGroupTitle">Estrutura organizacional</div>
      </div>
      <div class="filterGrid">
        <div class="field">
          <label>Diretoria</label>
          <select id="fDiretoria"></select>
        </div>
        <div class="field">
          <label>Superintendência / Coordenação</label>
          <select id="fEstrutura"></select>
        </div>
        <div class="field">
          <label>Gerência</label>
          <select id="fGerencia"></select>
        </div>
        <div class="field">
          <label>Unidade / nível local</label>
          <select id="fUnidade"></select>
        </div>
      </div>

      <button class="actionBtn mobileFilterToggle" id="toggleSecondary" type="button">Mais filtros</button>
    </div>

    <div class="filterGroup" id="secondaryFilters">
      <div class="filterGroupHead">
        <div class="filterGroupTitle">Classificação e território</div>
      </div>
      <div class="filterGrid secondary">
        <div class="field">
          <label>Categoria</label>
          <select id="fCategoria"></select>
        </div>
        <div class="field">
          <label>Subcategoria</label>
          <select id="fSubcategoria"></select>
        </div>
        <div class="field">
          <label>Bairro</label>
          <select id="fBairro"></select>
        </div>
        <div class="field">
          <label>Buscar</label>
          <input type="text" id="fBusca" placeholder="Setor, unidade, endereço ou bairro">
        </div>
      </div>
      <div class="filterActions" style="margin-top:10px">
        <button class="actionBtn" id="clearFiltersBtn" type="button">Limpar filtros</button>
      </div>
    </div>
  </section>

  <div class="breadcrumbBar" id="breadcrumbBar"></div>
  <div class="contextStrip" id="contextStrip" style="display:none"></div>

  <div class="kpis" id="kpis"></div>

  <section class="mapGrid">
    <div class="panel mapPanel">
      <div id="map"></div>
      <div class="mapLegend" id="mapLegend"></div>
    </div>

    <div class="panel executivePanel">
      <div class="panelHead">
        <div class="executiveTitleWrap">
          <h2 id="sideHeadTitle">Leitura executiva</h2>
          <div class="hint" id="sideHeadHint">Explore a estrutura pelo gráfico ou ranking.</div>
        </div>
      </div>
      <div class="body">
        <div class="explorerModes" id="explorerModes">
          <button class="explorerMode active" data-mode="hierarquia" type="button">Estrutura</button>
          <button class="explorerMode" data-mode="categoria" type="button">Categoria</button>
          <button class="explorerMode" data-mode="territorio" type="button">Território</button>
        </div>

        <div class="territorialNote" id="insightText">Carregando...</div>

        <div class="explorerMeta">
          <div class="sideTitle" id="chartTitle">Próximo nível</div>
          <div class="drillPill" id="drillPill">Clique para explorar</div>
        </div>
        <div class="chartWrap">
          <canvas id="donutChart"></canvas>
          <div class="emptyChart" id="emptyChart" style="display:none">Sem dados para exibir.</div>
        </div>

        <div class="explorerMeta">
          <div class="sideTitle" id="rankTitle">Detalhamento</div>
        </div>
        <div class="rankHint" id="rankHint"></div>
        <div class="territorialRank" id="rankBox"></div>
      </div>
    </div>
  </section>

  <div id="footer"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="../assets/components/hub-core.js"></script>
<script src="../assets/components/hub-utils.js"></script>
<script src="../assets/components/hub-cards.js"></script>
<script src="../assets/components/hub-charts.js"></script>
<script src="../assets/components/hub-filters.js"></script>
<script src="../assets/components/hub-layout.js"></script>

<script>
const CONFIG = {
  panelName: "Território Operacional",
  systemLabel: "HUB COMLURB",
  subtitle: "Visão territorial e hierárquica das estruturas da COMLURB, com exploração integrada entre mapa, filtros e níveis organizacionais."
};

const GEO_META = {
  dsu: {
    label: "Gerências DSU",
    paths: [
      "/COMLURB/assets/geojson/GERENCIAS_DSU.geojson",
      "../assets/geojson/GERENCIAS_DSU.geojson",
      "assets/geojson/GERENCIAS_DSU.geojson"
    ],
    color: "#5b9bd5",
    fill: "#244f82",
    insight: "Camada de referência das áreas de atuação das Gerências da Diretoria de Serviços Urbanos."
  },
  dlu: {
    label: "Bairros DLU",
    paths: [
      "/COMLURB/assets/geojson/DLU_Novos_Bairros_estrutura2025.geojson",
      "../assets/geojson/DLU_Novos_Bairros_estrutura2025.geojson",
      "assets/geojson/DLU_Novos_Bairros_estrutura2025.geojson"
    ],
    color: "#78aaa3",
    fill: "#1d6b62",
    insight: "Camada de referência territorial por bairros, estrutura DLU 2025."
  }
};

const CAT_COLORS = {
  "Operacional":"#5b9bd5",
  "Administrativo":"#78aaa3",
  "Apoio":"#b8c9de",
  "Manutenção":"#e87535",
  "Engenharia":"#78aaa3",
  "Gestão de Pessoas":"#a78bfa",
  "Financeiro":"#78aaa3",
  "Jurídico":"#ef6a5d",
  "Tecnologia":"#a78bfa",
  "Presidência":"#ffa02b"
};

const FILTERS = [
  {id:"fDiretoria", field:"diretoria"},
  {id:"fEstrutura", field:"estrutura"},
  {id:"fGerencia", field:"gerencia"},
  {id:"fUnidade", field:"unidade_hierarquica"},
  {id:"fCategoria", field:"categoria_hub"},
  {id:"fSubcategoria", field:"subcategoria_geo"},
  {id:"fBairro", field:"bairro"}
];

const HIERARCHY = [
  {field:"diretoria", label:"Diretoria", short:"Diretorias"},
  {field:"estrutura", label:"Estrutura", short:"Estruturas"},
  {field:"gerencia", label:"Gerência", short:"Gerências"},
  {field:"unidade_hierarquica", label:"Unidade", short:"Unidades"}
];

let map = null;
let activeGeoLayer = null;
let unitLayer = null;
let donutInstance = null;
let currentLayer = "unidades";
let ALL_ROWS = [];
let UNIDADES = [];
let FILTERED = [];
let SETOR_MAP = {};
let STATE = {
  drill: {},
  lastSource: null,
  explorerMode: "hierarquia",
  explorerField: null
};

function clean(v){
  return HUB.format.clean(v);
}
function normType(v){
  return clean(v)
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .toUpperCase()
    .replace(/\s+/g," ")
    .trim();
}
function isType(row, names){
  const t = normType(row.tipo);
  return names.some(n => {
    const target = normType(n);
    if (target === "GERENCIA") return t === "GERENCIA";
    if (target === "GERENCIA ADJUNTA") return t === "GERENCIA ADJUNTA";
    if (target === "DIRETORIA") return t === "DIRETORIA";
    return t === target || t.startsWith(target + " ") || t.startsWith(target + " /");
  });
}
function esc(v){ return HUB.format.esc(v ?? ""); }

async function fetchFirst(paths,type){
  const errors=[];
  for(const p of paths){
    try{
      const r=await fetch(p+(p.includes("?")?"&":"?")+"v="+Date.now(),{cache:"no-store"});
      if(!r.ok) throw new Error(r.status+" "+p);
      return type==="json"?await r.json():await r.text();
    }catch(e){errors.push(e.message)}
  }
  throw new Error(errors.join(" | "));
}
function prop(o,keys){
  o=o||{};
  const lower={};
  Object.keys(o).forEach(k=>lower[k.toLowerCase()]=o[k]);
  for(const k of keys){
    if(o[k]!==undefined && String(o[k]).trim()!=="") return o[k];
    if(lower[k.toLowerCase()]!==undefined && String(lower[k.toLowerCase()]).trim()!=="") return lower[k.toLowerCase()];
  }
  return "";
}
function nomeGeo(p){
  return prop(p,["GERENCIA","Gerencia","GERÊNCIA","NM_GERENCIA","BAIRRO","Bairro","NM_BAIRRO","NOME","Nome","name"])||"Território";
}
function popupGeo(p,key){
  const nome=nomeGeo(p);
  const ger=prop(p,["GERENCIA","Gerencia","GERÊNCIA","NM_GERENCIA"]);
  const bairro=prop(p,["BAIRRO","Bairro","NM_BAIRRO"]);
  let html=`<div class="popupTitle">${esc(nome)}</div>`+
    (ger?`<div class="popupLine"><b>Gerência:</b> ${esc(ger)}</div>`:"")+
    (bairro?`<div class="popupLine"><b>Bairro:</b> ${esc(bairro)}</div>`:"");
  if(ger){
    html+=`<button class="popupAction" data-geo-gerencia="${esc(ger)}">Ver estrutura relacionada</button>`;
  }else if(bairro){
    html+=`<button class="popupAction" data-geo-bairro="${esc(bairro)}">Ver unidades no bairro</button>`;
  }
  return html;
}
async function loadGeo(key){
  clearMapLayers();

  HUB.loading.showMultiple(["kpis","rankBox"]);
  document.getElementById("insightText").textContent="Carregando "+meta.label+"...";
  document.getElementById("chartTitle").textContent="Distribuição";
  document.getElementById("rankTitle").textContent="Ranking";
  document.getElementById("rankHint").textContent="";

  try{
    const geo=await fetchFirst(meta.paths,"json");
    const features=geo.features||[];
    activeGeoLayer=L.geoJSON(geo,{
      style:{color:meta.color,weight:1.8,fillColor:meta.fill,fillOpacity:.22,opacity:.95},
      onEachFeature:(feature,layer)=>{
        const p=feature.properties||{};
        layer.bindPopup(popupGeo(p,key));
        layer.on({
          mouseover:e=>e.target.setStyle({weight:3,fillOpacity:.34}),
          mouseout:e=>activeGeoLayer.resetStyle(e.target),
          click:()=>{
            const ger=prop(p,["GERENCIA","Gerencia","GERÊNCIA","NM_GERENCIA"]);

              if(bBairro) bBairro.addEventListener("click",()=>openUnitsFromGeo("bairro",bairro));
            });
          }
        });
      }
    }).addTo(map);

    if(activeGeoLayer.getBounds && activeGeoLayer.getBounds().isValid()){
      map.fitBounds(activeGeoLayer.getBounds(),{padding:[24,24]});
    }

    const counts={};
    features.forEach(f=>{
      const n=nomeGeo(f.properties||{});
      counts[n]=(counts[n]||0)+1;
    });
    const entries=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
    const top=entries[0]||["-",0];

    HUB.cards.render("kpis",[
      {label:"Camada ativa",value:0,note:meta.label,feature:true,format:"custom",customFormatter:()=>meta.label},
      {label:"Feições carregadas",value:features.length,note:"Registros na camada",color:"blue"},
      {label:"Grupos identificados",value:entries.length,note:"Agrupamentos distintos",color:"green"},
      {label:"Maior concentração",value:0,note:top[0]+" · "+HUB.format.int(top[1])+" feições",color:"purple",format:"custom",customFormatter:()=>top[0].length>14?top[0].slice(0,14)+"…":top[0]}
    ]);

    renderMapLegend([]);
    renderDonut(entries.slice(0,7),null,meta.color);
    renderRankBars(entries.slice(0,10),features.length,null);
    document.getElementById("insightText").innerHTML=
      meta.insight+" Foram carregadas <b>"+HUB.format.int(features.length)+"</b> feições, agrupadas em <b>"+HUB.format.int(entries.length)+"</b> conjuntos territoriais distintos.";
  }catch(e){
    document.getElementById("insightText").innerHTML=
      "Não foi possível carregar <b>"+esc(meta.label)+"</b>. Confirme o arquivo GeoJSON. Detalhe: "+esc(e.message);

  }
}

function sameText(a,b){
  return normType(a)===normType(b);
}

function normUnit(r){
  const lat=HUB.format.toNumber(r.latitude);
  const lon=HUB.format.toNumber(r.longitude);
  return {
    id:clean(r.id),
    setor:clean(r.setor),
    pai_setor:clean(r.pai_setor),
    tipo:clean(r.tipo)||"Não informado",
    nome_setor:clean(r.nome_setor),
    categoria_hub:clean(r.categoria_hub)||"Não classificado",
    subcategoria_geo:clean(r.subcategoria_geo)||"Não classificado",
    diretoria:clean(r.diretoria)||"Não informado",
    bairro:clean(r.bairro)||"Não informado",
    endereco:clean(r.endereco),
    latitude:lat,
    longitude:lon,
    street_view:clean(r.street_view)
  };
}

function buildSetorMap(rows){
  const m={};
  rows.forEach(r=>{if(r.setor)m[r.setor]=r});
  return m;
}

function ancestorChain(row,max=16){
  const chain=[];
  let atual=row;
  const seen=new Set();
  let hops=0;
  while(atual && hops<max && !seen.has(atual.setor)){
    chain.push(atual);
    seen.add(atual.setor);
    if(!atual.pai_setor || atual.pai_setor===atual.setor) break;
    atual=SETOR_MAP[atual.pai_setor];
    hops++;
  }
  return chain;
}

function nearestByTypes(chain,types,excludeCurrent=false){
  const start=excludeCurrent?1:0;
  for(let i=start;i<chain.length;i++){
    if(isType(chain[i],types)) return chain[i];
  }
  return null;
}

function deriveHierarchy(row){
  const chain=ancestorChain(row);

  const dirNode=nearestByTypes(chain,["DIRETORIA"]);
  const structNode=nearestByTypes(chain,["SUPERINTENDENCIA","COORDENADORIA","COORDENADORIA GERAL"]);
  const gerNode=nearestByTypes(chain,["GERENCIA"]);
  const gerAdjNode=nearestByTypes(chain,["GERENCIA ADJUNTA"]);

  const diretoria=(dirNode && dirNode.setor) || row.diretoria || "Não informado";
  const estrutura=structNode ? (structNode.nome_setor||structNode.setor) : "Sem estrutura intermediária";
  const gerencia=gerNode ? (gerNode.nome_setor||gerNode.setor) : "Sem gerência";
  const gerencia_adjunta=gerAdjNode ? (gerAdjNode.nome_setor||gerAdjNode.setor) : "";

  return {
    diretoria,
    estrutura,
    gerencia,
    gerencia_adjunta,
    unidade_hierarquica:row.nome_setor||row.setor||"Não informado",
    path:chain.slice().reverse().map(n=>({
      setor:n.setor,
      nome:n.nome_setor||n.setor,
      tipo:n.tipo
    }))
  };
}

async function loadUnidadesData(){
  const raw=await HUB.data.loadCSV("data/unidades_comlurb.csv",{name:"Unidades COMLURB",required:true});

  ALL_ROWS=raw.map(normUnit);
  SETOR_MAP=buildSetorMap(ALL_ROWS);

  ALL_ROWS.forEach(d=>Object.assign(d,deriveHierarchy(d)));

  UNIDADES=ALL_ROWS.filter(d=>
    Number.isFinite(d.latitude) &&
    Number.isFinite(d.longitude) &&
    d.latitude!==0 &&
    d.longitude!==0
  );
}

function getSelectValue(id){
  return document.getElementById(id)?.value || "";
}

function setSelectValueIfExists(select,value){
  if(!select || !value) return false;
  const opt=[...select.options].find(o=>sameText(o.value,value));
  if(opt){
    select.value=opt.value;
    return true;
  }
  return false;
}

function baseFilter(rows,ignoreId=null,includeDrill=true){
  let result=rows.filter(d=>{
    for(const f of FILTERS){
      if(f.id===ignoreId) continue;
      const v=getSelectValue(f.id);
      if(v && d[f.field]!==v) return false;
    }
    return true;
  });

  const busca=clean(document.getElementById("fBusca")?.value).toLowerCase();
  if(busca){
    result=result.filter(d=>{
      const hay=[
        d.setor,d.nome_setor,d.endereco,d.bairro,d.diretoria,d.estrutura,d.gerencia,
        d.categoria_hub,d.subcategoria_geo,d.tipo
      ].join(" ").toLowerCase();
      return hay.includes(busca);
    });
  }

  if(includeDrill){
    Object.entries(STATE.drill).forEach(([field,value])=>{
      if(value) result=result.filter(d=>d[field]===value);
    });
  }
  return result;
}

function populateSelect(id,field,rows,preserve=true){
  const el=document.getElementById(id);
  if(!el) return;
  const current=preserve?el.value:"";
  const values=[...new Set(rows.map(d=>d[field]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"pt-BR"));
  el.innerHTML=`<option value="">Todos</option>`+values.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join("");
  if(current && values.includes(current)) el.value=current;
}

function refreshCascadeOptions(sourceId=null){
  FILTERS.forEach(f=>{
    const rows=baseFilter(UNIDADES,f.id,true);
    populateSelect(f.id,f.field,rows,true);
  });

  // Se uma seleção ficou inválida após uma mudança hierárquica, limpa-a.
  let changed=false;
  FILTERS.forEach(f=>{
    const el=document.getElementById(f.id);
    if(el && el.value && ![...el.options].some(o=>o.value===el.value)){
      el.value="";
      changed=true;
    }
  });
  if(changed){
    FILTERS.forEach(f=>{
      const rows=baseFilter(UNIDADES,f.id,true);
      populateSelect(f.id,f.field,rows,true);
    });
  }
}

function applyUnitFilters(){
  FILTERED=baseFilter(UNIDADES,null,true);
}

function getHierarchyDepth(){
  const vals=HIERARCHY.map(h=>getSelectValue(FILTERS.find(f=>f.field===h.field)?.id || ""));
  const drillFields=Object.keys(STATE.drill);
  let deepest=-1;
  HIERARCHY.forEach((h,i)=>{
    if(vals[i] || drillFields.includes(h.field)) deepest=i;
  });
  return deepest;
}

function nextHierarchyField(){
  const depth=getHierarchyDepth();
  if(depth<0) return HIERARCHY[0];
  if(depth>=HIERARCHY.length-1) return null;
  return HIERARCHY[depth+1];
}

function activePath(){
  const items=[];
  const selected={
    diretoria:getSelectValue("fDiretoria"),
    estrutura:getSelectValue("fEstrutura"),
    gerencia:getSelectValue("fGerencia"),
    unidade_hierarquica:getSelectValue("fUnidade")
  };
  HIERARCHY.forEach(h=>{
    const v=STATE.drill[h.field] || selected[h.field];
    if(v) items.push({field:h.field,label:h.label,value:v});
  });
  return items;
}

function renderBreadcrumb(){
  const path=activePath();
  const el=document.getElementById("breadcrumbBar");
  if(currentLayer!=="unidades"){
    el.innerHTML="";
    return;
  }

  let html=`<span class="crumbLabel">Navegação</span>
    <button class="crumbBtn" data-clear-depth="-1">COMLURB</button>`;
  path.forEach((item,idx)=>{
    html+=`<span class="crumbSep">›</span>
      <button class="crumbBtn ${idx===path.length-1?"crumbCurrent":""}" data-clear-depth="${idx}">${esc(item.value)}</button>`;
  });
  el.innerHTML=html;

  el.querySelectorAll("[data-clear-depth]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const depth=Number(btn.dataset.clearDepth);
      trimHierarchy(depth);
    });
  });
}

function trimHierarchy(depth){
  const keep=new Set(HIERARCHY.slice(0,depth+1).map(h=>h.field));
  HIERARCHY.forEach((h,i)=>{
    const f=FILTERS.find(x=>x.field===h.field);
    if(i>depth && f){
      document.getElementById(f.id).value="";
    }
  });
  Object.keys(STATE.drill).forEach(k=>{
    if(HIERARCHY.some(h=>h.field===k) && !keep.has(k)) delete STATE.drill[k];
  });
  refreshCascadeOptions();
  renderUnidades();
}

function renderContextStrip(){
  const el=document.getElementById("contextStrip");
  const path=activePath();
  const extra=[];
  if(getSelectValue("fCategoria")) extra.push(getSelectValue("fCategoria"));
  if(getSelectValue("fSubcategoria")) extra.push(getSelectValue("fSubcategoria"));
  if(getSelectValue("fBairro")) extra.push(getSelectValue("fBairro"));

  if(!path.length && !extra.length && !clean(document.getElementById("fBusca").value)){
    el.style.display="none";
    el.innerHTML="";

    extra.length?extra.join(" · "):"",
    clean(document.getElementById("fBusca").value) ? `Busca: ${clean(document.getElementById("fBusca").value)}` : ""
  ].filter(Boolean).join(" · ");

  el.style.display="flex";
  el.innerHTML=`
    <div class="contextMain">
      <div class="contextTitle">${esc(title)}</div>
      <div class="contextSub">${esc(sub || "Hierarquia ativa")}</div>
    </div>
    <button class="contextReset" id="contextReset" type="button">Limpar recorte</button>
  `;
  document.getElementById("contextReset").addEventListener("click",()=>clearAll());
}

function drillToUnit(d){
  const hierarchyValues={
    fDiretoria:d.diretoria,
    fEstrutura:d.estrutura,
    fGerencia:d.gerencia,
    fUnidade:d.unidade_hierarquica
  };
  STATE.drill={};
  for(const [id,value] of Object.entries(hierarchyValues)){
    if(value && !value.startsWith("Sem ")){
      refreshCascadeOptions(id);
      setSelectValueIfExists(document.getElementById(id),value);
    }
  }
  refreshCascadeOptions();
  renderUnidades();
}

function renderMapUnits(){
  clearMapLayers();
  unitLayer=L.layerGroup();

  FILTERED.forEach(d=>{
    const color=CAT_COLORS[d.categoria_hub]||"#5b9bd5";
    const marker=L.circleMarker([d.latitude,d.longitude],{
      radius:6.5,color:"#06111f",weight:1.3,fillColor:color,fillOpacity:.9
    })
      .bindPopup(popupUnidade(d))
      .bindTooltip(d.setor,{permanent:true,direction:"right",offset:[7,0],className:"unitLabel"});

    marker.on("popupopen",()=>{
      const popupEl=marker.getPopup().getElement();
      if(!popupEl) return;
      const btn=popupEl.querySelector("[data-unit-setor]");
      if(btn) btn.addEventListener("click",()=>drillToUnit(d),{once:true});
    });

    marker.addTo(unitLayer);
  });

  unitLayer.addTo(map);

  if(FILTERED.length){
    const bounds=L.latLngBounds(FILTERED.map(d=>[d.latitude,d.longitude]));
    if(bounds.isValid()) map.fitBounds(bounds,{padding:[30,30],maxZoom:FILTERED.length===1?16:15});
  }
  updateLabelVisibility();

  const catsPresentes=[...new Set(FILTERED.map(d=>d.categoria_hub))];
  renderMapLegend(catsPresentes);
}

function renderMapLegend(cats){
  const el=document.getElementById("mapLegend");
  if(!cats.length){el.innerHTML="";return}
  el.innerHTML=cats.slice(0,10).map(c=>
    `<span><i class="legendDot" style="background:${CAT_COLORS[c]||"#5b9bd5"}"></i>${esc(c)}</span>`
  ).join("");
}

function countBy(rows,field,{dropPlaceholders=false}={}){
  const grouped={};
  rows.forEach(d=>{
    let k=d[field]||"Não informado";
    if(dropPlaceholders && (k.startsWith("Sem ") || k==="Não informado")) return;
    grouped[k]=(grouped[k]||0)+1;
  });
  return Object.entries(grouped).sort((a,b)=>b[1]-a[1] || a[0].localeCompare(b[0],"pt-BR"));
}

function renderRankBars(entries,total,field){
  const max=entries[0]?entries[0][1]:1;
  const clickable=currentLayer==="unidades" && !!field;
  const box=document.getElementById("rankBox");

  box.innerHTML=entries.map(([name,val])=>`
    <div class="territorialRow ${clickable?"":"is-static"}" data-rank-value="${esc(name)}">
      <div class="territorialName" title="${esc(name)}">${esc(name)}</div>
      <div class="territorialTrack"><div class="territorialFill" style="width:${Math.max(4,val/max*100)}%"></div></div>
      <div class="territorialNum">${HUB.format.int(val)}</div>
      <div class="territorialPct">${HUB.format.pct(HUB.format.calcPct(val,total))}</div>
    </div>
  `).join("") || `<div class="empty">Sem registros no recorte.</div>`;

  if(clickable){
    box.querySelectorAll("[data-rank-value]").forEach(row=>{
      row.addEventListener("click",()=>applyExplorerSelection(field,row.dataset.rankValue));
    });
  }
}

function drillFromRanking(field,value){
  const idx=HIERARCHY.findIndex(h=>h.field===field);
  if(idx<0) return;

  // Escreve o nível clicado no select correspondente sempre que possível.
  const filter=FILTERS.find(f=>f.field===field);
  if(filter){
    setSelectValueIfExists(document.getElementById(filter.id),value);
  }else{
    STATE.drill[field]=value;
  }

  // Níveis abaixo são limpos para o ranking poder continuar descendo corretamente.
  HIERARCHY.slice(idx+1).forEach(h=>{
    const f=FILTERS.find(x=>x.field===h.field);
    if(f) document.getElementById(f.id).value="";
    delete STATE.drill[h.field];
  });

  refreshCascadeOptions(filter?.id);
  renderUnidades();
}

function explorerAxis(){
  if(STATE.explorerMode==="categoria"){
    return {field:"categoria_hub",label:"Categorias",singular:"categoria"};
  }
  if(STATE.explorerMode==="territorio"){
    return {field:"bairro",label:"Bairros",singular:"bairro"};
  }

  const next=nextHierarchyField();
  if(next) return {field:next.field,label:next.short,singular:next.label.toLowerCase()};
  return {field:"bairro",label:"Bairros",singular:"bairro"};
}

function explorerEntries(){
  let axis=explorerAxis();
  let entries=countBy(FILTERED,axis.field,{dropPlaceholders:true});

  if(STATE.explorerMode==="hierarquia" && !entries.length){
    const start=HIERARCHY.findIndex(h=>h.field===axis.field)+1;
    for(let i=start;i<HIERARCHY.length;i++){
      const candidate=countBy(FILTERED,HIERARCHY[i].field,{dropPlaceholders:true});
      if(candidate.length){
        axis={field:HIERARCHY[i].field,label:HIERARCHY[i].short,singular:HIERARCHY[i].label.toLowerCase()};
        entries=candidate;
        break;
      }
    }
  }
  STATE.explorerField=axis.field;
  return {axis,entries};
}

function applyExplorerSelection(field,value){
  if(!value) return;
  if(HIERARCHY.some(h=>h.field===field)){
    drillFromRanking(field,value);
    return;
  }
  const filter=FILTERS.find(f=>f.field===field);
  if(filter){
    const el=document.getElementById(filter.id);
    refreshCascadeOptions(filter.id);
    if(setSelectValueIfExists(el,value)){
      refreshCascadeOptions(filter.id);
      renderUnidades();
    }
  }
}

function renderDonut(entries,field,singleColor){
  const canvas=document.getElementById("donutChart");
  const empty=document.getElementById("emptyChart");
  if(donutInstance){donutInstance.destroy();donutInstance=null}

  if(!entries.length){
    canvas.style.display="none";
    empty.style.display="flex";
    return;
  }
  canvas.style.display="block";
  empty.style.display="none";

  const labels=entries.slice(0,8).map(e=>e[0]);
  const values=entries.slice(0,8).map(e=>e[1]);
  const palette=labels.map((_,i)=>{
    if(singleColor) return singleColor;
    const colors=["#6aa7df","#78aaa3","#8fb7d8","#a78bfa","#e0a06a","#6f8fae","#9caec1","#5f7892"];
    return colors[i%colors.length];
  });

  donutInstance=new Chart(canvas,{
    type:"doughnut",
    data:{
      labels,
      datasets:[{
        data:values,
        backgroundColor:palette,
        borderColor:"rgba(6,17,31,.92)",
        borderWidth:3,
        hoverOffset:3
      }]
    },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      cutout:"70%",
      animation:{duration:260},
      onHover:(evt,els)=>{
        canvas.style.cursor=els.length?"pointer":"default";
      },
      onClick:(evt,els)=>{
        if(!els.length) return;
        const idx=els[0].index;
        applyExplorerSelection(field,labels[idx]);
      },
      plugins:{
        legend:{display:false},
        tooltip:{
          displayColors:false,
          callbacks:{
            label:(ctx)=>{
              const total=values.reduce((a,b)=>a+b,0)||1;
              const pct=(ctx.raw/total*100).toFixed(1).replace(".",",");
              return `${ctx.label}: ${HUB.format.int(ctx.raw)} · ${pct}%`;
            }
          }
        }
      }
    }
  });
}

function renderUnidades(){
  applyUnitFilters();
  renderBreadcrumb();
  renderContextStrip();
  renderMapUnits();

  const total=FILTERED.length;
  const operacional=FILTERED.filter(d=>d.categoria_hub==="Operacional").length;
  const diretorias=new Set(FILTERED.map(d=>d.diretoria)).size;
  const bairros=new Set(FILTERED.map(d=>d.bairro)).size;

  const next=nextHierarchyField();
  const path=activePath();

  HUB.cards.render("kpis",[
    {label:"Unidades no recorte",value:total,note:path.length?"Hierarquia ativa":"Total mapeado",feature:true,onclick:"clearAll()"},
    {label:"Operacional",value:operacional,note:HUB.format.pct(HUB.format.calcPct(operacional,total))+" do recorte",color:"blue"},
    {label:"Diretorias",value:diretorias,note:"Diretorias representadas",color:"green"},
    {label:"Bairros",value:bairros,note:"Bairros com presença mapeada",color:"purple"}
  ]);

  const explorer=explorerEntries();
  const axis=explorer.axis;
  const entries=explorer.entries;
  const clickableField=axis.field;

  document.getElementById("chartTitle").textContent=
    STATE.explorerMode==="hierarquia" ? `Próximo nível · ${axis.label}` : axis.label;
  document.getElementById("rankTitle").textContent=axis.label;

  const canDrill=entries.length>0;
  document.getElementById("drillPill").textContent=
    canDrill ? "Clique no gráfico ou lista" : "Sem próximo nível";

  document.getElementById("rankHint").textContent=
    canDrill
      ? (HIERARCHY.some(h=>h.field===axis.field)
          ? "Selecione um item para aprofundar a estrutura."
          : `Selecione um ${axis.singular} para aplicar o recorte.`)
      : "Não há registros no recorte atual.";

  renderDonut(entries,clickableField);
  renderRankBars(entries.slice(0,10),total,clickableField);

  const top=entries[0]||["-",0];
  const hierarchyText=path.length
    ? `Você está em <b>${esc(path[path.length-1].value)}</b>.`
    : "Você está na visão geral da COMLURB.";

  let modeText="";
  if(STATE.explorerMode==="hierarquia"){
    modeText=entries.length
      ? ` O próximo nível disponível é <b>${esc(axis.label)}</b>; <b>${esc(top[0])}</b> concentra ${HUB.format.int(top[1])} registros.`
      : "";
  }else if(STATE.explorerMode==="categoria"){
    modeText=entries.length
      ? ` Na classificação, <b>${esc(top[0])}</b> é a categoria mais representativa, com ${HUB.format.pct(HUB.format.calcPct(top[1],total))} do recorte.`
      : "";
  }else{
    modeText=entries.length
      ? ` Territorialmente, <b>${esc(top[0])}</b> concentra ${HUB.format.int(top[1])} registros (${HUB.format.pct(HUB.format.calcPct(top[1],total))}).`
      : "";
  }

  document.getElementById("sideHeadTitle").textContent="Leitura executiva";
  document.getElementById("sideHeadHint").textContent=
    STATE.explorerMode==="hierarquia"
      ? "Navegue pela estrutura sem sair da leitura executiva."
      : "Clique para aplicar o recorte ao painel inteiro.";
  document.getElementById("insightText").innerHTML=
    hierarchyText+
    ` O recorte reúne <b>${HUB.format.int(total)}</b> unidades em <b>${HUB.format.int(bairros)}</b> bairros.`+
    modeText;
}

function clearAll(render=true){
  FILTERS.forEach(f=>{
    const el=document.getElementById(f.id);
    if(el) el.value="";
  });
  const busca=document.getElementById("fBusca");
  if(busca) busca.value="";
  STATE.drill={};
  refreshCascadeOptions();
  if(render) renderUnidades();
}

function bindFilters(){
  FILTERS.forEach(f=>{
    const el=document.getElementById(f.id);
    el.addEventListener("change",()=>{
      STATE.lastSource=f.id;

      // Mudou um nível hierárquico: limpa níveis hierárquicos abaixo.
      const hIdx=HIERARCHY.findIndex(h=>h.field===f.field);
      if(hIdx>=0){
        HIERARCHY.slice(hIdx+1).forEach(h=>{
          const child=FILTERS.find(x=>x.field===h.field);
          if(child) document.getElementById(child.id).value="";
          delete STATE.drill[h.field];
        });
      }

      // Se o usuário alterou manualmente um nível, o drill daquele nível sai.
      delete STATE.drill[f.field];

      refreshCascadeOptions(f.id);
      renderUnidades();
    });
  });

  let searchTimer=null;
  document.getElementById("fBusca").addEventListener("input",()=>{
    clearTimeout(searchTimer);
    searchTimer=setTimeout(()=>{
      refreshCascadeOptions();
      renderUnidades();
    },120);
  });

  document.getElementById("clearFiltersBtn").addEventListener("click",()=>clearAll());

  document.getElementById("toggleSecondary").addEventListener("click",()=>{
    const sec=document.getElementById("secondaryFilters");
    const open=sec.classList.toggle("open");
    document.getElementById("toggleSecondary").textContent=open?"Menos filtros":"Mais filtros";
  });

  document.querySelectorAll(".explorerMode").forEach(btn=>{
    btn.addEventListener("click",()=>{
      STATE.explorerMode=btn.dataset.mode;
      document.querySelectorAll(".explorerMode").forEach(b=>b.classList.toggle("active",b===btn));
      if(currentLayer==="unidades") renderUnidades();
    });
  });
}

async function init(){
  HUB.header.render("header",{
    systemLabel:CONFIG.systemLabel,
    title:CONFIG.panelName,
    subtitle:CONFIG.subtitle
  });

  renderLayerTabs();
  initMap();

  HUB.loading.showMultiple(["kpis","rankBox"]);
  try{
    await loadUnidadesData();
    bindFilters();
    refreshCascadeOptions();
    document.getElementById("filtrosUnidades").classList.add("active");
    renderUnidades();
  }catch(e){
    document.getElementById("insightText").textContent="Erro ao carregar unidades: "+e.message;
  }

  HUB.footer.render("footer");
  window.addEventListener("resize",()=>{
    if(map) map.invalidateSize();
    if(donutInstance) donutInstance.resize();
  });
}

document.addEventListener("DOMContentLoaded",init);
</script>
</body>
</html>
