<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Território Operacional | HUB COMLURB</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="../assets/css/hub-premium.css">

<style>
/* Somente o que é específico de mapa/legenda — o resto vem do hub-premium.css */
.mapGrid{display:grid;grid-template-columns:1.5fr 1fr;gap:14px}
.mapPanel{position:relative;overflow:hidden;padding:0!important}
#map{height:640px;width:100%;background:var(--painel2)}
.leaflet-container{background:var(--painel2);font-family:"Segoe UI",Arial,sans-serif}
.leaflet-control-zoom a{background:var(--painel)!important;color:#fff!important;border-color:var(--linha)!important}
.leaflet-control-attribution{background:rgba(6,17,31,.82)!important;color:#8faac5!important;font-size:10px}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--painel);color:#fff;border:1px solid var(--linha)}
.popupTitle{font-size:14px;font-weight:900;margin-bottom:6px;color:#fff}
.popupLine{font-size:12px;color:#c7d8ee;margin:3px 0}
.popupLine b{color:#fff}

.leaflet-tooltip.unitLabel{background:rgba(6,17,31,.82);border:1px solid var(--linha);color:#dcecff;font-size:10px;font-weight:800;letter-spacing:.02em;padding:2px 6px;border-radius:6px;box-shadow:none;pointer-events:none}
.leaflet-tooltip.unitLabel:before{border-right-color:rgba(6,17,31,.82)}
#map:not(.zoomedIn) .leaflet-tooltip.unitLabel{display:none}

.mapLegend{position:absolute;left:12px;bottom:12px;z-index:500;max-width:calc(100% - 24px);display:flex;gap:7px;flex-wrap:wrap;padding:9px 10px;border-radius:14px;background:rgba(6,17,31,.86);border:1px solid var(--linha)}
.mapLegend span{font-size:11px;color:var(--silenciado);display:flex;align-items:center;gap:5px;white-space:nowrap}
.legendDot{width:8px;height:8px;border-radius:999px;display:inline-block}

.layerTabs{display:flex;gap:8px;margin:0 0 14px;flex-wrap:wrap}
.layerTab{border:1px solid var(--linha);background:var(--painel);color:#dcecff;border-radius:999px;padding:10px 16px;font-size:12px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;transition:.15s}
.layerTab:hover{border-color:var(--azul2)}
.layerTab.active{background:linear-gradient(90deg,#244f82,#5b9bd5);border-color:#7db7ed;color:#fff}

.chartWrap{height:210px;position:relative;margin-bottom:14px}
.sideTitle{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:#a8bdd5;font-weight:900;margin:16px 0 10px}
.sideTitle:first-child{margin-top:0}
</style>
</head>
<body>
<div class="app">

<div id="header"></div>

<div class="layerTabs" id="layerTabs"></div>

<section class="filters" id="filtrosUnidades" style="display:none">
  <div class="field"><label>Categoria</label><select id="fCategoria"></select></div>
  <div class="field"><label>Subcategoria</label><select id="fSubcategoria"></select></div>
  <div class="field"><label>Diretoria</label><select id="fDiretoria"></select></div>
  <div class="field"><label>Gerência</label><select id="fGerencia"></select></div>
  <div class="field"><label>Bairro</label><select id="fBairro"></select></div>
  <div class="field"><label>Buscar</label><input type="text" id="fBusca" placeholder="Setor, nome, endereço ou bairro"></div>
  <button class="actionBtn" onclick="clearAll()">Limpar filtros</button>
</section>

<div id="drillBanner"></div>

<div class="kpis" id="kpis"></div>

<section class="mapGrid">
  <div class="panel mapPanel">
    <div id="map"></div>
    <div class="mapLegend" id="mapLegend"></div>
  </div>

  <div class="panel">
    <div class="panelHead">
      <h2 id="sideHeadTitle">Leitura executiva</h2>
      <div class="hint" id="sideHeadHint">Distribuição do recorte ativo.</div>
    </div>
    <div class="body">
      <div class="territorialNote" id="insightText">Carregando...</div>

      <div class="sideTitle" id="chartTitle">Distribuição</div>
      <div class="chartWrap"><canvas id="donutChart"></canvas></div>

      <div class="sideTitle" id="rankTitle">Ranking</div>
      <div class="territorialRank" id="rankBox"></div>
    </div>
  </div>
</section>

<div id="footer"></div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<script src="../assets/components/hub-core.js"></script>
<script src="../assets/components/hub-utils.js"></script>
<script src="../assets/components/hub-cards.js"></script>
<script src="../assets/components/hub-charts.js"></script>
<script src="../assets/components/hub-filters.js"></script>
<script src="../assets/components/hub-layout.js"></script>

<script>
/* ============================================
   CONFIGURAÇÃO
   ============================================ */
const CONFIG = {
  panelName: "Território Operacional",
  systemLabel: "HUB COMLURB",
  subtitle: "Leitura geoespacial das estruturas da COMLURB — áreas territoriais, gerências e unidades físicas em uma camada executiva de apoio à gestão."
};

const GEO_META = {
  dsu: {
    label: "Gerências DSU",
    paths: [
      "/COMLURB/assets/geojson/GERENCIAS_DSU.geojson",
      "../assets/geojson/GERENCIAS_DSU.geojson",
      "assets/geojson/GERENCIAS_DSU.geojson"
    ],
    color: "#5b9bd5", fill: "#244f82",
    insight: "Camada de referência das áreas de atuação das Gerências da Diretoria de Serviços Urbanos."
  },
  dlu: {
    label: "Bairros DLU",
    paths: [
      "/COMLURB/assets/geojson/DLU_Novos_Bairros_estrutura2025.geojson",
      "../assets/geojson/DLU_Novos_Bairros_estrutura2025.geojson",
      "assets/geojson/DLU_Novos_Bairros_estrutura2025.geojson"
    ],
    color: "#78aaa3", fill: "#1d6b62",
    insight: "Camada de referência territorial por bairros, estrutura DLU 2025."
  }
};

const CAT_COLORS = {
  "Operacional": "#5b9bd5",
  "Administrativo": "#78aaa3",
  "Apoio": "#b8c9de",
  "Manutenção": "#e87535",
  "Engenharia": "#78aaa3",
  "Gestão de Pessoas": "#a78bfa",
  "Financeiro": "#78aaa3",
  "Jurídico": "#ef6a5d",
  "Tecnologia": "#a78bfa",
  "Presidência": "#ffa02b"
};

const UNIT_FILTERS = [
  { id: "fCategoria", field: "categoria_hub" },
  { id: "fSubcategoria", field: "subcategoria_geo" },
  { id: "fDiretoria", field: "diretoria" },
  { id: "fGerencia", field: "gerencia" },
  { id: "fBairro", field: "bairro" }
];

/* ============================================
   ESTADO GLOBAL
   ============================================ */
let map = null;
let activeGeoLayer = null;
let unitLayer = null;
let donutInstance = null;

let currentLayer = "unidades";
let UNIDADES = [];   // dados originais (unidades)
let DATA = [];       // alias genérico p/ camada ativa (usado no drill)
let FILTERED = [];
let DRILL = null;

/* ============================================
   MAPA BASE
   ============================================ */
const ZOOM_LABEL_THRESHOLD = 14;

function initMap() {
  map = L.map("map", { zoomControl: true, preferCanvas: true }).setView([-22.9068, -43.1729], 11);
  L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
    maxZoom: 20,
    attribution: "&copy; OpenStreetMap &copy; CARTO"
  }).addTo(map);
  map.on("zoomend", updateLabelVisibility);
}

function updateLabelVisibility() {
  const el = document.getElementById("map");
  if (map.getZoom() >= ZOOM_LABEL_THRESHOLD) el.classList.add("zoomedIn");
  else el.classList.remove("zoomedIn");
}

function clearMapLayers() {
  if (activeGeoLayer) { map.removeLayer(activeGeoLayer); activeGeoLayer = null; }
  if (unitLayer) { map.removeLayer(unitLayer); unitLayer = null; }
}

/* ============================================
   TABS DE CAMADA
   ============================================ */
function renderLayerTabs() {
  const tabs = [
    { key: "dsu", label: GEO_META.dsu.label },
    { key: "dlu", label: GEO_META.dlu.label },
    { key: "unidades", label: "Unidades" }
  ];
  HUB.dom.setHTML("layerTabs", tabs.map(t =>
    `<button class="layerTab ${t.key === currentLayer ? "active" : ""}" data-layer="${t.key}">${HUB.format.esc(t.label)}</button>`
  ).join(""));

  document.querySelectorAll(".layerTab").forEach(btn => {
    btn.addEventListener("click", () => switchLayer(btn.dataset.layer));
  });
}

function switchLayer(key) {
  if (key === currentLayer) return;
  currentLayer = key;
  DRILL = null;
  HUB.drillBanner.hide("drillBanner");
  renderLayerTabs();
  HUB.dom.hide("filtrosUnidades");
  if (key === "unidades") {
    HUB.dom.show("filtrosUnidades");
    document.getElementById("filtrosUnidades").style.display = "grid";
    renderUnidades();
  } else {
    loadGeo(key);
  }
}

/* ============================================
   CAMADAS GEOJSON (DSU / DLU)
   ============================================ */
async function fetchFirst(paths, type) {
  const errors = [];
  for (const p of paths) {
    try {
      const r = await fetch(p + (p.includes("?") ? "&" : "?") + "v=" + Date.now(), { cache: "no-store" });
      if (!r.ok) throw new Error(r.status + " " + p);
      return type === "json" ? await r.json() : await r.text();
    } catch (e) { errors.push(e.message); }
  }
  throw new Error(errors.join(" | "));
}

function prop(o, keys) {
  o = o || {};
  const lower = {};
  Object.keys(o).forEach(k => lower[k.toLowerCase()] = o[k]);
  for (const k of keys) {
    if (o[k] !== undefined && String(o[k]).trim() !== "") return o[k];
    if (lower[k.toLowerCase()] !== undefined && String(lower[k.toLowerCase()]).trim() !== "") return lower[k.toLowerCase()];
  }
  return "";
}

function nomeGeo(p) {
  return prop(p, ["GERENCIA", "Gerencia", "GERÊNCIA", "NM_GERENCIA", "BAIRRO", "Bairro", "NM_BAIRRO", "NOME", "Nome", "name"]) || "Território";
}

function popupGeo(p) {
  const nome = nomeGeo(p);
  const ger = prop(p, ["GERENCIA", "Gerencia", "GERÊNCIA", "NM_GERENCIA"]);
  const bairro = prop(p, ["BAIRRO", "Bairro", "NM_BAIRRO"]);
  return `<div class="popupTitle">${HUB.format.esc(nome)}</div>` +
    (ger ? `<div class="popupLine"><b>Gerência:</b> ${HUB.format.esc(ger)}</div>` : "") +
    (bairro ? `<div class="popupLine"><b>Bairro:</b> ${HUB.format.esc(bairro)}</div>` : "");
}

async function loadGeo(key) {
  clearMapLayers();
  const meta = GEO_META[key];
  HUB.loading.showMultiple(["kpis", "rankBox"]);
  document.getElementById("insightText").textContent = "Carregando " + meta.label + "...";
  document.getElementById("chartTitle").textContent = "Distribuição";
  document.getElementById("rankTitle").textContent = "Ranking";

  try {
    const geo = await fetchFirst(meta.paths, "json");
    const features = geo.features || [];

    activeGeoLayer = L.geoJSON(geo, {
      style: { color: meta.color, weight: 1.8, fillColor: meta.fill, fillOpacity: .22, opacity: .95 },
      onEachFeature: (feature, layer) => {
        layer.bindPopup(popupGeo(feature.properties || {}));
        layer.on({
          mouseover: e => e.target.setStyle({ weight: 3, fillOpacity: .34 }),
          mouseout: e => activeGeoLayer.resetStyle(e.target)
        });
      }
    }).addTo(map);

    if (activeGeoLayer.getBounds && activeGeoLayer.getBounds().isValid()) {
      map.fitBounds(activeGeoLayer.getBounds(), { padding: [24, 24] });
    }

    const counts = {};
    features.forEach(f => { const n = nomeGeo(f.properties || {}); counts[n] = (counts[n] || 0) + 1; });
    const entries = Object.entries(counts).sort((a, b) => b[1] - a[1]);
    const top = entries[0] || ["-", 0];

    HUB.cards.render("kpis", [
      { label: "Camada ativa", value: 0, note: meta.label, feature: true, format: "custom", customFormatter: () => meta.label },
      { label: "Feições carregadas", value: features.length, note: "Registros na camada", color: "blue" },
      { label: "Grupos identificados", value: entries.length, note: "Agrupamentos distintos", color: "green" },
      { label: "Maior concentração", value: 0, note: top[0] + " · " + HUB.format.int(top[1]) + " feições", color: "purple", format: "custom", customFormatter: () => top[0].length > 14 ? top[0].slice(0, 14) + "…" : top[0] }
    ]);

    renderMapLegend([]);
    renderDonut(entries.slice(0, 5), meta.color);
    renderRankBars(entries.slice(0, 10), features.length);

    document.getElementById("insightText").innerHTML =
      meta.insight + " Foram carregadas <b>" + HUB.format.int(features.length) + "</b> feições, agrupadas em <b>" + HUB.format.int(entries.length) + "</b> conjuntos territoriais distintos.";
  } catch (e) {
    document.getElementById("insightText").innerHTML =
      "Não foi possível carregar <b>" + meta.label + "</b>. Confirme se o arquivo está publicado em <b>assets/geojson/</b>. Detalhe: " + HUB.format.esc(e.message);
    HUB.cards.render("kpis", [{ label: "Camada ativa", value: 0, note: meta.label, feature: true, format: "custom", customFormatter: () => meta.label }]);
  }
}

/* ============================================
   CAMADA UNIDADES COMLURB
   ============================================ */
function normUnit(r) {
  let lat = HUB.format.toNumber(r.latitude);
  let lon = HUB.format.toNumber(r.longitude);
  return {
    id: HUB.format.clean(r.id),
    setor: HUB.format.clean(r.setor),
    pai_setor: HUB.format.clean(r.pai_setor),
    tipo: HUB.format.clean(r.tipo) || "Não informado",
    nome_setor: HUB.format.clean(r.nome_setor),
    categoria_hub: HUB.format.clean(r.categoria_hub) || "Não classificado",
    subcategoria_geo: HUB.format.clean(r.subcategoria_geo) || "Não classificado",
    diretoria: HUB.format.clean(r.diretoria) || "Não informado",
    bairro: HUB.format.clean(r.bairro) || "Não informado",
    endereco: HUB.format.clean(r.endereco),
    latitude: lat,
    longitude: lon,
    street_view: HUB.format.clean(r.street_view)
  };
}

const TIPOS_GERENCIA = new Set(["GERÊNCIA", "GERÊNCIA ADJUNTA", "SUPERINTENDENCIA", "DIRETORIA"]);

function buildSetorMap(rows) {
  const map = {};
  rows.forEach(r => { if (r.setor) map[r.setor] = r; });
  return map;
}

function computeGerencia(row, setorMap) {
  let atual = row;
  let saltos = 0;
  while (atual && saltos < 8) {
    if (TIPOS_GERENCIA.has(atual.tipo)) return atual.nome_setor;
    if (!atual.pai_setor || atual.pai_setor === atual.setor) break;
    atual = setorMap[atual.pai_setor];
    saltos++;
  }
  return row.nome_setor || "Não classificado";
}

async function loadUnidadesData() {
  const raw = await HUB.data.loadCSV("data/unidades_comlurb.csv", { name: "Unidades COMLURB", required: true });
  UNIDADES = raw.map(normUnit).filter(d => Number.isFinite(d.latitude) && Number.isFinite(d.longitude) && d.latitude && d.longitude);

  const setorMap = buildSetorMap(UNIDADES);
  UNIDADES.forEach(d => { d.gerencia = computeGerencia(d, setorMap); });
}

function populateUnitFilters() {
  HUB.filters.populateAll(UNIDADES, UNIT_FILTERS);
}

function applyUnitFilters() {
  FILTERED = HUB.filters.apply(UNIDADES, UNIT_FILTERS.map(f => ({
    id: f.id, field: f.field,
    matcher: f.id === "fBusca" ? undefined : undefined
  })));

  const busca = HUB.format.clean(document.getElementById("fBusca").value).toLowerCase();
  if (busca) {
    FILTERED = FILTERED.filter(d => {
      const hay = [d.setor, d.nome_setor, d.endereco, d.bairro, d.diretoria, d.categoria_hub].join(" ").toLowerCase();
      return hay.includes(busca);
    });
  }

  if (DRILL) {
    FILTERED = FILTERED.filter(d => d[DRILL.field] === DRILL.value);
  }
}

function popupUnidade(d) {
  return `<div class="popupTitle">${HUB.format.esc(d.nome_setor || d.setor)}</div>` +
    `<div class="popupLine"><b>Setor:</b> ${HUB.format.esc(d.setor)}</div>` +
    `<div class="popupLine"><b>Categoria:</b> ${HUB.format.esc(d.categoria_hub)}</div>` +
    `<div class="popupLine"><b>Diretoria:</b> ${HUB.format.esc(d.diretoria)}</div>` +
    `<div class="popupLine"><b>Tipo:</b> ${HUB.format.esc(d.tipo)}</div>` +
    `<div class="popupLine"><b>Bairro:</b> ${HUB.format.esc(d.bairro)}</div>` +
    (d.endereco ? `<div class="popupLine"><b>Endereço:</b> ${HUB.format.esc(d.endereco)}</div>` : "") +
    (d.street_view ? `<div class="popupLine"><a href="${HUB.format.esc(d.street_view)}" target="_blank" rel="noopener">Street View →</a></div>` : "");
}

function renderMapUnits() {
  clearMapLayers();
  unitLayer = L.layerGroup();

  FILTERED.forEach(d => {
    const color = CAT_COLORS[d.categoria_hub] || "#5b9bd5";
    L.circleMarker([d.latitude, d.longitude], {
      radius: 6.5, color: "#06111f", weight: 1.3, fillColor: color, fillOpacity: .9
    })
      .bindPopup(popupUnidade(d))
      .bindTooltip(d.setor, { permanent: true, direction: "right", offset: [7, 0], className: "unitLabel" })
      .addTo(unitLayer);
  });

  unitLayer.addTo(map);

  if (FILTERED.length) {
    const bounds = L.latLngBounds(FILTERED.map(d => [d.latitude, d.longitude]));
    if (bounds.isValid()) map.fitBounds(bounds, { padding: [30, 30] });
  }
  updateLabelVisibility();

  const catsPresentes = [...new Set(FILTERED.map(d => d.categoria_hub))];
  renderMapLegend(catsPresentes);
}

function renderMapLegend(cats) {
  const el = document.getElementById("mapLegend");
  if (!cats.length) { el.innerHTML = ""; return; }
  el.innerHTML = cats.slice(0, 10).map(c =>
    `<span><i class="legendDot" style="background:${CAT_COLORS[c] || "#5b9bd5"}"></i>${HUB.format.esc(c)}</span>`
  ).join("");
}

function countBy(rows, field) {
  const grouped = {};
  rows.forEach(d => { const k = d[field] || "Não informado"; grouped[k] = (grouped[k] || 0) + 1; });
  return Object.entries(grouped).sort((a, b) => b[1] - a[1]);
}

function renderRankBars(entries, total) {
  const max = entries[0] ? entries[0][1] : 1;
  document.getElementById("rankBox").innerHTML = entries.map(([name, val]) => `
    <div class="territorialRow" onclick="${currentLayer === "unidades" ? `setDrillFrom('${escapeAttr(name)}')` : ""}">
      <div class="territorialName" title="${HUB.format.esc(name)}">${HUB.format.esc(name)}</div>
      <div class="territorialTrack"><div class="territorialFill" style="width:${Math.max(4, val / max * 100)}%"></div></div>
      <div class="territorialNum">${HUB.format.int(val)}</div>
      <div class="territorialPct">${HUB.format.pct(HUB.format.calcPct(val, total))}</div>
    </div>
  `).join("") || `<div class="empty">Sem registros no recorte.</div>`;
}

function escapeAttr(s) { return String(s).replace(/'/g, "\\'"); }

let drillField = "categoria_hub";
function setDrillFrom(value) {
  setDrill(drillField, value, value);
}

function renderDonut(entries, singleColor) {
  const canvas = document.getElementById("donutChart");
  if (donutInstance) { donutInstance.destroy(); donutInstance = null; }
  if (!entries.length) return;
  donutInstance = HUB.charts.donut("donutChart", {
    labels: entries.map(e => e[0]),
    values: entries.map(e => e[1])
  }, singleColor ? { colors: entries.map(() => singleColor) } : {});
}

function renderUnidades() {
  document.getElementById("sideHeadTitle").textContent = "Leitura executiva";
  document.getElementById("sideHeadHint").textContent = "Distribuição das unidades no recorte ativo.";
  document.getElementById("chartTitle").textContent = "Por categoria";
  document.getElementById("rankTitle").textContent = "Por diretoria";
  drillField = "diretoria";

  applyUnitFilters();
  renderMapUnits();

  const total = FILTERED.length;
  const operacional = FILTERED.filter(d => d.categoria_hub === "Operacional").length;
  const diretorias = new Set(FILTERED.map(d => d.diretoria)).size;
  const bairros = new Set(FILTERED.map(d => d.bairro)).size;

  HUB.cards.render("kpis", [
    { label: "Unidades no recorte", value: total, note: "Total mapeado", feature: true, onclick: "clearDrill()" },
    { label: "Operacional", value: operacional, note: HUB.format.pct(HUB.format.calcPct(operacional, total)) + " do recorte", color: "blue", onclick: "setDrill('categoria_hub','Operacional','Operacional')" },
    { label: "Diretorias", value: diretorias, note: "Diretorias representadas", color: "green" },
    { label: "Bairros", value: bairros, note: "Bairros com presença mapeada", color: "purple" }
  ]);

  const byCat = countBy(FILTERED, "categoria_hub");
  const byDir = countBy(FILTERED, "diretoria");

  renderDonut(byCat.slice(0, 6));
  drillField = "diretoria";
  renderRankBars(byDir.slice(0, 10), total);

  const topDir = byDir[0] || ["-", 0];
  document.getElementById("insightText").innerHTML =
    "O recorte atual reúne <b>" + HUB.format.int(total) + "</b> unidades. A diretoria com maior presença é <b>" + HUB.format.esc(topDir[0]) + "</b>, com <b>" + HUB.format.int(topDir[1]) + "</b> registros. A categoria Operacional responde por <b>" + HUB.format.pct(HUB.format.calcPct(operacional, total)) + "</b> do total mapeado.";
}

/* ============================================
   FILTROS / DRILL
   ============================================ */
function clearAll() {
  HUB.filters.clear();
  document.getElementById("fBusca").value = "";
  DRILL = null;
  HUB.drillBanner.hide("drillBanner");
  renderUnidades();
}

function setDrill(field, value, label) {
  DRILL = { field, value, label };
  HUB.drillBanner.show("drillBanner", {
    title: "Drill down: " + label,
    description: "Mapa e ranking filtrados por este recorte.",
    onClear: "clearDrill()"
  });
  renderUnidades();
}

function clearDrill() {
  DRILL = null;
  HUB.drillBanner.hide("drillBanner");
  renderUnidades();
}

/* ============================================
   BOOT
   ============================================ */
async function init() {
  HUB.header.render("header", {
    systemLabel: CONFIG.systemLabel,
    title: CONFIG.panelName,
    subtitle: CONFIG.subtitle
  });

  renderLayerTabs();
  initMap();

  HUB.loading.showMultiple(["kpis", "rankBox"]);

  try {
    await loadUnidadesData();
    HUB.filters.init({});
    populateUnitFilters();
    HUB.filters.onChange(() => renderUnidades());
    document.getElementById("fBusca").addEventListener("input", () => renderUnidades());

    HUB.dom.show("filtrosUnidades");
    document.getElementById("filtrosUnidades").style.display = "grid";
    renderUnidades();
  } catch (e) {
    document.getElementById("insightText").textContent = "Erro ao carregar unidades: " + e.message;
  }

  HUB.footer.render("footer");
}

document.addEventListener("DOMContentLoaded", init);
</script>

</body>
</html>
